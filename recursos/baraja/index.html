<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La baraja de la orilla · La presa que queremos</title>
<meta name="description" content="Baraja de ideas para la orilla de la presa de La Florida: una carta a la vez, en el teléfono. Va, quizá o no; voltea la carta para copiar el prompt de Gemini. Gestión y Manejo de Proyectos, UAQ Campus Concá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0F6E6E;--teal-dark:#0B3C49;--mint:#E3F1EF;--amber:#D9A441;--amber-dark:#A8731F;--paper:#F8FBF9;--ink:#1E2B27;--ink-soft:#4A5C55;--line:#D8E5DF;--rojo:#B4443C;--gris:#7A8B85;--c:#0F6E6E;--cl:#E3F1EF;--eq:#0F6E6E}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--teal)}
.wrap{max-width:620px;margin:0 auto;padding:0 14px;width:100%}
header.top{background:var(--eq);color:#fff;padding:10px 0}
header .wrap{display:flex;align-items:center;gap:10px}
header .t{font-family:'Fraunces',serif;font-size:1.05rem;flex:1;line-height:1.2}
header .t small{display:block;font-family:'Instrument Sans',sans-serif;font-size:.72rem;opacity:.85;font-weight:400}
header .pill{border:1.5px solid rgba(255,255,255,.45);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
.sync{font-size:.7rem;color:#D5EAE2;display:flex;align-items:center;gap:5px;justify-content:flex-end;padding:3px 0 0}
.sync i{width:7px;height:7px;border-radius:50%;background:#9AA6A1;display:inline-block}
.sync.ok i{background:#7FD6A5} .sync.pend i{background:var(--amber)} .sync.err i{background:#F08C84}
main{flex:1;padding:14px 0 90px}
/* progreso */
.prog{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--ink-soft);margin-bottom:10px}
.prog .barra{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.prog .barra i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.prog b{color:var(--ink)}
/* la carta */
.carta{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(10,74,58,.10);animation:entra .25s}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.band{background:var(--c);color:#fff;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:9px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band b{font-family:'JetBrains Mono',monospace;font-size:1.3rem;letter-spacing:.05em;text-transform:none;white-space:nowrap;flex:none}
.vis{background:var(--cl);height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.vis img{width:100%;height:100%;object-fit:cover}
.vis svg{width:190px;height:140px;color:var(--c)}
.vis img ~ svg{display:none}
.cuerpo{padding:16px 18px 14px}
.cuerpo h2{font-size:1.45rem;margin-bottom:8px}
.cuerpo p{font-size:.97rem;margin-bottom:9px}
.cuerpo p b{display:block;color:var(--c);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:1px}
.cuerpo p.senal{background:var(--cl);border-radius:10px;padding:10px 12px}
.mas{font-size:.85rem;font-weight:700;color:var(--c);padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.ficha{font-size:.76rem;color:var(--ink-soft);margin-top:6px}
.ficha b{color:var(--ink)}
/* reverso */
.reverso{background:#fff}
.reverso .cuerpo h2{font-size:1.2rem;color:var(--c)}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.pasos div{border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:.74rem;color:var(--ink-soft);line-height:1.35}
.pasos b{display:block;font-family:'Fraunces',serif;font-size:1.2rem;color:var(--c);line-height:1}
.copiar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:13px 14px;font-weight:700;font-size:.95rem;background:var(--c);color:#fff;margin-bottom:8px}
.copiar.sec{background:#fff;color:var(--c);border:1.5px solid var(--c)}
.copiar.ok{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark)}
.verp{font-size:.8rem;color:var(--ink-soft);text-align:center;margin:4px 0 10px}
.verp button{text-decoration:underline;color:var(--c);font-weight:600}
pre{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:.7rem;line-height:1.4;white-space:pre-wrap;background:#F6F6F3;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:200px;overflow:auto;margin-bottom:10px}
.links{font-size:.84rem;line-height:1.5;margin-top:4px}
.links a{display:block;margin-bottom:3px;word-break:break-word}
/* decidir */
.decide{padding:14px 18px 18px;border-top:1px solid var(--line);background:#fff}
.decide .preg{font-family:'Fraunces',serif;font-size:1.15rem;margin-bottom:10px;color:var(--teal-dark)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tres button{border:2px solid var(--line);border-radius:14px;padding:14px 6px;font-weight:700;font-size:1.05rem;color:var(--ink-soft);background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.tres button small{font-weight:400;font-size:.68rem;color:var(--ink-soft)}
.tres button.on.va{background:var(--teal);border-color:var(--teal);color:#fff} .tres button.on.va small{color:#D5EAE2}
.tres button.on.quiza{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.tres button.on.no{background:var(--gris);border-color:var(--gris);color:#fff} .tres button.on.no small{color:#E6ECEA}
.sigue{margin-top:12px;animation:entra .25s}
.sigue label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c);margin:10px 0 4px}
.sigue input,.sigue textarea,.form input,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:.95rem;background:#fff}
.sigue textarea,.form textarea{min-height:58px;resize:vertical}
.quien{font-size:.74rem;color:var(--ink-soft);margin-top:8px}
/* barra inferior */
.pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.pie .wrap{display:flex;gap:8px;align-items:center}
.pie .nav{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);font-size:1.5rem;color:var(--teal-dark);display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.pie .nav:disabled{opacity:.3}
.pie .sig{flex:1;height:48px;border-radius:999px;background:var(--teal-dark);color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px}
.pie .sig.suave{background:#fff;color:var(--teal-dark);border:1.5px solid var(--line)}
.menu{display:flex;gap:6px;justify-content:center;margin-top:8px}
.menu button{font-size:.76rem;font-weight:700;color:var(--ink-soft);padding:4px 10px;border-radius:999px}
.menu button.on{background:var(--mint);color:var(--teal-dark)}
/* pantallas */
.pant h2{font-size:1.4rem;color:var(--teal-dark);margin-bottom:4px}
.pant p.b{color:var(--ink-soft);font-size:.92rem;margin-bottom:12px}
.resumen{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px;font-size:.84rem}
.resumen span{border-radius:999px;padding:4px 11px;background:#fff;border:1px solid var(--line);font-weight:600}
.resumen span.meta{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark)} .resumen span.meta.mal{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.lista{display:flex;flex-direction:column;gap:10px}
.fila{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%}
.fila .cod{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--c);background:var(--cl);border-radius:10px;padding:10px 10px;min-width:86px;text-align:center;line-height:1.1}
.fila h3{font-size:1rem;margin-bottom:2px}
.fila .det{font-size:.84rem;color:var(--ink-soft)}
.fila .det b{color:var(--ink)}
.rt{font-size:.82rem;border-radius:8px;padding:5px 9px;border-left:4px solid var(--amber);margin-top:5px}
.rt.falta{background:#FBF1DC} .rt.choca{background:#F6E2E0;border-color:var(--rojo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--teal);color:#fff;text-decoration:none}
.btn.ghost{background:#fff;color:var(--teal-dark);border:1.5px solid var(--line)}
.btn.amber{background:var(--amber);color:var(--ink)} .btn.rojo{background:var(--rojo);color:#fff}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.vacio{color:var(--ink-soft);font-size:.9rem;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--teal-dark);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:all .25s;z-index:99;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(11,60,73,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.open{display:flex}
.dlg{background:var(--paper);border-radius:18px;max-width:480px;width:100%;max-height:94vh;overflow:auto}
.form{padding:22px 20px 20px}
.form h2{font-size:1.35rem;color:var(--teal-dark);margin-bottom:4px}
.form p{color:var(--ink-soft);font-size:.9rem;margin-bottom:10px}
.form label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--teal);margin:12px 0 4px}
.equipos{display:grid;gap:8px;margin:10px 0 6px}
.eqb{border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;background:#fff;display:flex;gap:12px;align-items:center}
.eqb b{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--eqc);min-width:30px}
.eqb span{font-size:.92rem;font-weight:600}
.eqb small{display:block;font-weight:400;color:var(--ink-soft);font-size:.78rem}
.eqb.on{border-color:var(--eqc);background:color-mix(in srgb,var(--eqc) 10%,#fff)}
.retro-sel{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.retro-sel button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:.84rem;color:var(--ink-soft)}
.retro-sel button.on{background:var(--eqc);border-color:var(--eqc);color:#fff}
.rform{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dos button{border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;background:#fff;color:var(--ink-soft)}
.dos button.on.falta{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.dos button.on.choca{background:var(--rojo);border-color:var(--rojo);color:#fff}
.hoja{display:none}
.fin{text-align:center;padding:30px 10px 10px}
.fin h2{font-size:1.6rem;color:var(--teal-dark)}
.fin p{color:var(--ink-soft);margin:6px 0 16px}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.modos button{border:2px solid var(--line);border-radius:14px;padding:12px 10px;background:#fff;font-weight:700;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.9rem}
.modos button i{display:block;border:2.5px solid currentColor;border-radius:4px;width:18px;height:30px}
.modos button i.anc{width:34px;height:22px}
.modos button small{font-weight:400;font-size:.72rem}
.modos button.on{border-color:var(--teal);background:var(--mint);color:var(--teal-dark)}
/* modo horizontal (computadora) */
body.h .wrap{max-width:1080px}
body.h .pant,body.h .fin{max-width:720px;margin:0 auto}
body.h .carta{display:grid;grid-template-columns:1.15fr .85fr;align-items:stretch}
body.h .cara{min-width:0}
body.h .vis{height:250px}
body.h .decide{border-top:none;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:22px 24px}
body.h .decide .preg{font-size:1.35rem}
body.h .tres button{padding:18px 6px;font-size:1.15rem}
body.h .pie .wrap{max-width:560px}
body.h main{padding-bottom:100px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="t" id="titulo">La baraja de la orilla<small>La presa que queremos · La Florida</small></div><button class="pill" id="pillEq" onclick="abrirEntrar()">equipo</button></div><div class="wrap sync" id="sync"></div></header>
<main><div class="wrap" id="main"></div></main>
<div class="pie"><div class="wrap" id="pie"></div><div class="menu" id="menu"></div></div>
<div class="modal" id="entrar"><div class="dlg"><div class="form" id="entrarForm"></div></div></div>
<div class="modal" id="nueva"><div class="dlg"><div class="form" id="nuevaForm"></div></div></div>
<div class="toast" id="toast"></div>
<textarea class="hoja" id="hoja" aria-hidden="true"></textarea>

<script src="baraja-datos.js"></script>
<script src="baraja-config.js"></script>
<script>
const D = window.BARAJA, EQUIPOS = window.BARAJA_EQUIPOS, API = (window.BARAJA_API_URL || '').trim();
const KEY = 'baraja-orilla-v4';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COD = id => String(id).toUpperCase().replace(/^N(\d)-/, '$1N-');
const hora = ts => ts ? new Date(ts).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}) : '';
const NOMBRE = {va:'Va', quiza:'Quizá', no:'No'};

/* ---------- estado ---------- */
const S = (() => {
  const base = {equipo:0, quien:'', modo:'', dec:{}, nuevas:[], pend:{}, pendN:{}, retroEnv:[], pos:0};
  try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) { return base; }
})();
const q = new URLSearchParams(location.search);
if (q.get('equipo') && EQUIPOS.some(e => String(e.n) === q.get('equipo'))) S.equipo = Number(q.get('equipo'));
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const SV = {retro:[], otros:{}};
let vista = 'baraja', reverso = false, masInfo = false, verPrompt = false;

function equipo(){ return EQUIPOS.find(e => e.n === S.equipo); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2000); }

/* ---------- cartas ---------- */
const PICTO_NUEVA = '<svg viewBox="0 0 80 60"><path d="M40 14v32M24 30h32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const HUECO = '[[ WHAT GOES HERE: material, size and position — e.g. a rustic timber bench 2.4 m long under the big oak ]]';
function cartaNueva(n){
  const desc = '(described in Spanish) ' + n.titulo + ': ' + (n.que || '') + ' ' + (n.ejemplo || '');
  return Object.assign({nueva:true, picto:PICTO_NUEVA, ficha:'', origen:'equipo', links:[], busca:n.titulo,
    gimg:'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(n.titulo), pin:'https://www.pinterest.com/search/pins/?q=' + encodeURIComponent(n.titulo),
    p1:D.pBlanco1.replace(HUECO, desc), p2:D.pBlanco2.replace(HUECO, desc), hacer:'', senal:''}, n);
}
function misCartas(){ const e = equipo(); if (!e) return []; return D.cards.filter(c => e.comps.includes(c.comp)).concat(S.nuevas.map(cartaNueva)); }
function compDe(c){ return D.comps[c.comp]; }
function dec(id){ return S.dec[id] || {estado:'', cuida:'', nota:'', quien:'', ts:0}; }
function cuenta(){ const o = {va:0, quiza:0, no:0, sin:0}; misCartas().forEach(c => { const e = dec(c.id).estado; if (o[e] != null) o[e]++; else o.sin++; }); return o; }
function decidir(id, patch){ S.dec[id] = Object.assign({}, dec(id), patch, {quien:S.quien, ts:Date.now()}); S.pend[id] = 1; save(); programar(); }

/* ---------- hoja ---------- */
let timer = null, syncEstado = API ? 'pend' : 'local';
function programar(){ clearTimeout(timer); timer = setTimeout(enviar, 700); pintarSync('pend'); }
async function post(payload){ const r = await fetch(API, {method:'POST', body:JSON.stringify(payload)}); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error'); return j; }
async function enviar(){
  if (!API || !S.equipo) { pintarSync('local'); return; }
  try {
    for (const id of Object.keys(S.pendN)) { const n = S.nuevas.find(x => x.id === id); if (!n) { delete S.pendN[id]; continue; } await post({action:'nueva', equipo:S.equipo, id:n.id, titulo:n.titulo, que:n.que, ejemplo:n.ejemplo, quien:n.quien, ts:n.ts}); delete S.pendN[id]; }
    for (const id of Object.keys(S.pend)) { const d = dec(id); const ts = d.ts; await post({action:'decidir', equipo:S.equipo, carta:id, estado:d.estado, zona:'', cuida:d.cuida, nota:d.nota, quien:d.quien, ts}); if (dec(id).ts === ts) delete S.pend[id]; }
    save(); pintarSync('ok');
  } catch(e) { pintarSync('err'); }
}
async function get(params){ const u = API + (API.includes('?') ? '&' : '?') + new URLSearchParams(params).toString(); const r = await fetch(u); return r.json(); }
async function poll(){
  if (!API || !S.equipo || document.visibilityState !== 'visible') return;
  try {
    const j = await get({action:'equipo', equipo:S.equipo}); if (!j.ok) throw new Error(j.error);
    let cambio = false;
    (j.decisiones || []).forEach(d => { if (S.pend[d.carta]) return; const l = dec(d.carta); if (d.ts >= (l.ts || 0) && [l.estado, l.cuida, l.nota, l.quien].join('|') !== [d.estado, d.cuida, d.nota, d.quien].join('|')) { S.dec[d.carta] = {estado:d.estado, cuida:d.cuida, nota:d.nota, quien:d.quien, ts:d.ts}; cambio = true; } });
    (j.nuevas || []).forEach(n => { if (S.pendN[n.id]) return; const i = S.nuevas.findIndex(x => x.id === n.id); const o = {id:n.id, comp:compNueva(), n:0, titulo:n.titulo, que:n.que, ejemplo:n.ejemplo, quien:n.quien, ts:n.ts}; if (i < 0) { S.nuevas.push(o); cambio = true; } else if (n.ts > (S.nuevas[i].ts || 0)) { S.nuevas[i] = o; cambio = true; } });
    const rj = JSON.stringify(j.retro || []); if (rj !== JSON.stringify(SV.retro)) { SV.retro = j.retro || []; cambio = true; }
    if (!Object.keys(S.pend).length && !Object.keys(S.pendN).length) pintarSync('ok');
    if (cambio) { save(); if (vista !== 'baraja' || !document.activeElement || !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render(); }
  } catch(e) { pintarSync('err'); }
}
function pintarSync(est){ syncEstado = est; const el = $('#sync'); el.className = 'wrap sync ' + est; el.innerHTML = S.equipo ? '<i></i>' + ({ok:'el equipo ve lo mismo', pend:'guardando…', err:'sin conexión: guardado en este teléfono', local:'guardado en este teléfono'}[est]) : ''; }
function compNueva(){ const e = equipo(); return e ? e.comps[e.comps.length - 1] : '5'; }

/* ---------- render ---------- */
function aplicarModo(){ document.body.classList.toggle('h', S.modo === 'h'); }
function render(){
  aplicarModo();
  const e = equipo();
  $('#pillEq').textContent = e ? `Equipo ${e.n}${S.quien ? ' · ' + S.quien : ''}` : 'Elige equipo';
  document.documentElement.style.setProperty('--eq', e ? e.color : '#0F6E6E');
  $('#menu').innerHTML = e ? [['baraja','Cartas'],['van','Las que van'],['retro','Ronda 2']].map(([k, t]) => `<button class="${vista === k ? 'on' : ''}" onclick="ir('${k}')">${t}</button>`).join('') : '';
  pintarSync(syncEstado);
  if (!e) { $('#main').innerHTML = ''; $('#pie').innerHTML = ''; return; }
  ({baraja:renderCarta, van:renderVan, retro:renderRetro})[vista]();
}
function ir(v){ vista = v; reverso = false; render(); window.scrollTo(0, 0); }

/* ---------- la carta, una a la vez ---------- */
function renderCarta(){
  const cs = misCartas(); if (S.pos > cs.length) S.pos = cs.length; if (S.pos < 0) S.pos = 0;
  const m = $('#main');
  if (S.pos === cs.length) { renderFin(cs); return; }
  const c = cs[S.pos]; const cc = compDe(c); const d = dec(c.id);
  m.style.setProperty('--c', cc.color); m.style.setProperty('--cl', cc.claro);
  const n = cuenta();
  m.innerHTML = `<div class="prog"><span>Carta <b>${S.pos + 1}</b> de ${cs.length}</span><div class="barra"><i style="width:${(S.pos) / cs.length * 100}%"></i></div><span>${n.va} van</span></div>
  <div class="carta" id="carta"><div class="cara">${reverso ? reversoHTML(c) : frenteHTML(c, cc)}</div>
    <div class="decide">
      <div class="preg">${d.estado ? 'Decidieron: ' + NOMBRE[d.estado] : '¿Va, quizá o no?'}</div>
      <div class="tres">${['va','quiza','no'].map(k => `<button class="${k}${d.estado === k ? ' on' : ''}" onclick="elegir('${c.id}','${k}')">${NOMBRE[k]}<small>${({va:'resuelve, hay quien cuide', quiza:'tiene dudas', no:'falla'})[k]}</small></button>`).join('')}</div>
      <div class="sigue" id="sigue" style="display:${d.estado ? '' : 'none'}">
        ${d.estado === 'va' ? `<label>¿Quién la cuidaría?</label><input value="${esc(d.cuida)}" placeholder="Una persona, un comité, un grupo" oninput="decidir('${c.id}',{cuida:this.value})">` : ''}
        <label>${d.estado === 'va' ? 'Comentario (opcional)' : d.estado === 'no' ? '¿Por qué no? (opcional)' : '¿Qué duda tienen? (opcional)'}</label><textarea placeholder="Una línea basta" oninput="decidir('${c.id}',{nota:this.value})">${esc(d.nota)}</textarea>
        ${d.quien && d.ts ? `<div class="quien">${esc(d.quien)} · ${hora(d.ts)}</div>` : ''}
      </div>
    </div>
  </div>`;
  $('#pie').innerHTML = `<button class="nav" onclick="mover(-1)" ${S.pos === 0 ? 'disabled' : ''} aria-label="Anterior">‹</button><button class="sig${d.estado ? '' : ' suave'}" onclick="mover(1)">${d.estado ? 'Siguiente carta' : 'Saltar por ahora'} ›</button>`;
}
function frenteHTML(c, cc){
  return `<div class="band"><span>${c.comp} · ${esc(cc.nombre)}</span><b>${COD(c.id)}</b></div>
    <div class="vis">${c.nueva ? '' : `<img src="img/${c.id}.png" alt="" onerror="this.remove()">`}${c.picto}</div>
    <div class="cuerpo"><h2>${esc(c.titulo)}</h2><p>${esc(c.que)}</p>${c.ejemplo ? `<p><b>Por ejemplo</b>${esc(c.ejemplo)}</p>` : ''}
      ${masInfo ? `${c.hacer ? `<p><b>Para que quede</b>${esc(c.hacer)}</p>` : ''}${c.senal ? `<p class="senal"><b>¿Cómo sabemos que funciona?</b>${esc(c.senal)}</p>` : ''}<div class="ficha">${origenTxt(c)}</div>` : ''}
      ${(c.hacer || c.senal) ? `<button class="mas" onclick="masInfo=!masInfo;render()">${masInfo ? '− Menos' : '+ Para que quede y cómo sabemos'}</button><br>` : ''}
      <button class="mas" onclick="reverso=true;verPrompt=false;render();window.scrollTo(0,0)">↻ Voltear: imaginarla sobre la foto</button>
    </div>`;
}
function origenTxt(c){ return c.origen === 'banco' ? `ficha <b>${esc(c.ficha)}</b> del banco de patrones` : c.origen === 'consulta' ? 'viene de la consulta' : c.origen === 'curso' ? 'ya está en el curso (semanas 5 a 7)' : c.nueva ? 'carta en blanco del equipo' : 'propuesta sin ficha'; }
function reversoHTML(c){
  const links = (c.links || []).map(l => `<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join('');
  return `<div class="band"><span>Reverso · ${esc(c.titulo)}</span><b>${COD(c.id)}</b></div>
    <div class="reverso"><div class="cuerpo"><h2>Imagínala sobre la foto</h2>
      <div class="pasos"><div><b>1</b>Foto horizontal del lugar exacto, con algo de escala.</div><div><b>2</b>Marca en rojo el sitio con el marcador del celular.</div><div><b>3</b>Sube la foto a Gemini y pega el prompt.</div></div>
      <button class="copiar" onclick="copiar(this, cartaActual().p1)">Copiar el prompt (montaje realista)</button>
      <button class="copiar sec" onclick="copiar(this, cartaActual().p2)">Copiar la variante: boceto a lápiz</button>
      <div class="verp"><button onclick="verPrompt=!verPrompt;render()">${verPrompt ? 'Ocultar el texto' : 'Ver el texto del prompt'}</button></div>
      ${verPrompt ? `<pre>${esc(c.p1)}</pre>` : ''}
      <div class="links"><a href="${esc(c.gimg)}" target="_blank" rel="noopener">Más ideas: imágenes de «${esc(c.busca)}»</a>${links}</div>
      <button class="mas" onclick="reverso=false;render();window.scrollTo(0,0)">↩ Volver al frente</button>
    </div></div>`;
}
function cartaActual(){ return misCartas()[S.pos]; }
function elegir(id, k){ decidir(id, {estado:k}); render(); const s = $('#sigue'); if (s) s.scrollIntoView({behavior:'smooth', block:'nearest'}); }
function mover(k){ S.pos += k; reverso = false; masInfo = false; verPrompt = false; save(); render(); window.scrollTo(0, 0); }

function renderFin(cs){
  const n = cuenta(); const m = $('#main');
  m.innerHTML = `<div class="fin"><h2>Se acabaron las cartas</h2><p>${n.va} en va · ${n.quiza} en quizá · ${n.no} en no${n.sin ? ` · ${n.sin} sin decidir` : ''}</p>
    ${n.va < 3 || n.va > 5 ? `<p><b>La meta es de tres a cinco en «va».</b> ${n.va < 3 ? 'Vuelvan a las de quizá.' : 'Sobran: cuáles regresan a quizá.'}</p>` : '<p>Quedan entre tres y cinco: ya está.</p>'}
    <div class="acciones" style="justify-content:center"><button class="btn" onclick="ir('van')">Ver las que van</button><button class="btn ghost" onclick="abrirNueva()">Falta una idea: carta en blanco</button></div></div>`;
  $('#pie').innerHTML = `<button class="nav" onclick="mover(-1)" aria-label="Anterior">‹</button><button class="sig suave" onclick="S.pos=0;save();render();window.scrollTo(0,0)">Volver a la primera carta</button>`;
}

/* ---------- copiar ---------- */
async function copiar(btn, txt){
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch(e) {}
  if (!ok) { try { const h = $('#hoja'); h.style.display = 'block'; h.value = txt; h.focus(); h.select(); h.setSelectionRange(0, txt.length); ok = document.execCommand('copy'); h.style.display = 'none'; } catch(e) {} }
  if (ok) { if (btn) { const t = btn.textContent; btn.classList.add('ok'); btn.textContent = 'Copiado ✓'; setTimeout(() => { btn.classList.remove('ok'); btn.textContent = t; }, 1600); } toast('Copiado. Pégalo en Gemini junto con la foto.'); }
  else { verPrompt = true; render(); toast('No se pudo copiar: selecciona el texto con el dedo.'); }
}

/* ---------- entrar ---------- */
function abrirEntrar(){
  let sel = S.equipo || 0; let modo = S.modo || (window.innerWidth > 900 ? 'h' : 'v'); const el = $('#entrarForm');
  const pinta = () => {
    el.innerHTML = `<h2>¿De qué equipo eres?</h2><p>Cada equipo ve las cartas de su línea, una por una.</p>
      <div class="equipos">${EQUIPOS.map(e => `<button class="eqb${sel === e.n ? ' on' : ''}" style="--eqc:${e.color}" data-n="${e.n}"><b>${e.n}</b><span>${esc(e.nombre)}<small>${e.comps.map(k => D.comps[k].nombre).join(' / ')}</small></span></button>`).join('')}</div>
      <label>Tu nombre de pila</label><input id="quienIn" value="${esc(S.quien)}" placeholder="Para saber quién decidió qué" autocomplete="given-name">
      <label>¿Dónde la vas a usar?</label>
      <div class="modos"><button class="${modo === 'v' ? 'on' : ''}" data-m="v"><i></i>Celular<small>vertical</small></button><button class="${modo === 'h' ? 'on' : ''}" data-m="h"><i class="anc"></i>Computadora<small>horizontal</small></button></div>
      <div class="acciones" style="margin-bottom:0"><button class="btn" id="entrarOk">Entrar</button>${S.equipo ? '<button class="btn ghost" onclick="cerrarEntrar()">Cancelar</button>' : ''}</div>`;
    el.querySelectorAll('.eqb').forEach(b => b.onclick = () => { sel = Number(b.dataset.n); pinta(); $('#quienIn').focus(); });
    el.querySelectorAll('.modos button').forEach(b => b.onclick = () => { modo = b.dataset.m; pinta(); });
    $('#entrarOk').onclick = () => {
      if (!sel) { toast('Elige tu equipo.'); return; }
      const cambio = sel !== S.equipo; S.equipo = sel; S.modo = modo; S.quien = $('#quienIn').value.trim().slice(0, 40); if (cambio) S.pos = 0;
      save(); cerrarEntrar(); vista = 'baraja'; render(); if (cambio) poll();
    };
  };
  pinta(); $('#entrar').classList.add('open');
}
function cerrarEntrar(){ if (S.equipo) $('#entrar').classList.remove('open'); }

/* ---------- carta en blanco ---------- */
function abrirNueva(id){
  const n = id ? S.nuevas.find(x => x.id === id) : null; const el = $('#nuevaForm');
  el.innerHTML = `<h2>${n ? 'Editar la carta' : 'Carta en blanco'}</h2><p>Una idea que no estaba en la baraja. Como las demás: qué es y un ejemplo con medida.</p>
    <label>Título</label><input id="nvT" value="${esc(n ? n.titulo : '')}" placeholder="Por ejemplo: Tendedero de pescado a la sombra">
    <label>¿Qué es?</label><textarea id="nvQ" placeholder="Qué se pone, se siembra, se acuerda o se abre">${esc(n ? n.que : '')}</textarea>
    <label>Por ejemplo</label><textarea id="nvE" placeholder="Dónde, de qué tamaño, con qué material">${esc(n ? n.ejemplo : '')}</textarea>
    <div class="acciones" style="margin-bottom:0"><button class="btn" id="nvOk">${n ? 'Guardar' : 'Agregar a la baraja'}</button><button class="btn ghost" onclick="document.getElementById('nueva').classList.remove('open')">Cancelar</button></div>`;
  $('#nvOk').onclick = () => {
    const t = $('#nvT').value.trim(); if (!t) { toast('Ponle título.'); return; }
    const o = n || {id:'n' + S.equipo + '-' + String(S.nuevas.length + 1).padStart(2, '0'), comp:compNueva(), n:0};
    Object.assign(o, {titulo:t.slice(0, 120), que:$('#nvQ').value.trim().slice(0, 900), ejemplo:$('#nvE').value.trim().slice(0, 900), quien:S.quien, ts:Date.now()});
    if (!n) S.nuevas.push(o);
    S.pendN[o.id] = 1; save(); programar(); $('#nueva').classList.remove('open');
    if (!n) { S.pos = misCartas().findIndex(c => c.id === o.id); vista = 'baraja'; }
    render(); window.scrollTo(0, 0); toast(n ? 'Carta guardada.' : 'Carta agregada: decídanla.');
  };
  $('#nueva').classList.add('open'); $('#nvT').focus();
}

/* ---------- las que van ---------- */
function renderVan(){
  const e = equipo(); const cs = misCartas(); const n = cuenta();
  const van = cs.filter(c => dec(c.id).estado === 'va'); const quiza = cs.filter(c => dec(c.id).estado === 'quiza');
  const retroDe = id => SV.retro.filter(r => r.carta === id); const general = SV.retro.filter(r => !r.carta || !cs.some(c => c.id === r.carta));
  $('#main').innerHTML = `<div class="pant"><h2>Las que van · equipo ${e.n}</h2><p class="b">El código grande es el que se escribe en el post-it del mapa.</p>
    <div class="resumen"><span class="meta${n.va >= 3 && n.va <= 5 ? '' : ' mal'}">${n.va} en va · meta de 3 a 5</span><span>${n.quiza} en quizá</span>${n.sin ? `<span>${n.sin} sin decidir</span>` : ''}</div>
    ${van.length ? '<div class="lista">' + van.map(c => { const d = dec(c.id); const cc = compDe(c); const rs = retroDe(c.id); return `<button class="fila" style="--c:${cc.color};--cl:${cc.claro}" onclick="irA('${c.id}')"><div class="cod">${COD(c.id)}</div><div><h3>${esc(c.titulo)}</h3><div class="det">${d.cuida ? `cuida <b>${esc(d.cuida)}</b>` : 'sin doliente todavía'}${d.nota ? `<br>${esc(d.nota)}` : ''}</div>${rs.map(rt).join('')}</div></button>`; }).join('') + '</div>' : '<div class="vacio">Todavía no hay cartas en «va».</div>'}
    ${general.length ? `<h2 style="margin-top:22px;font-size:1.1rem">Lo que nos dijeron del conjunto</h2>${general.map(rt).join('')}` : ''}
    ${quiza.length ? `<h2 style="margin-top:22px;font-size:1.1rem">En quizá</h2><div class="lista">${quiza.map(c => `<button class="fila" style="--c:${compDe(c).color};--cl:${compDe(c).claro}" onclick="irA('${c.id}')"><div class="cod">${COD(c.id)}</div><div><h3>${esc(c.titulo)}</h3><div class="det">${esc(dec(c.id).nota)}</div></div></button>`).join('')}</div>` : ''}
    <div class="acciones" style="margin-top:22px"><button class="btn ghost" onclick="copiar(this, resumen())">Copiar resumen</button><button class="btn ghost" onclick="copiar(this, codigo())">Copiar código del equipo</button><button class="btn ghost" onclick="abrirNueva()">Carta en blanco</button></div></div>`;
  $('#pie').innerHTML = `<button class="sig" onclick="ir('baraja')">Seguir con las cartas ›</button>`;
}
function irA(id){ S.pos = misCartas().findIndex(c => c.id === id); save(); ir('baraja'); }
function rt(r){ return `<div class="rt ${r.tipo}"><b>${r.tipo === 'choca' ? 'Choca con lo mío' : 'Falta'}</b> · equipo ${r.de}${r.quien ? ' (' + esc(r.quien) + ')' : ''}: ${esc(r.texto)}</div>`; }
function resumen(){
  const e = equipo(); const L = [`Equipo ${e.n} · ${e.nombre} · Baraja de la orilla`];
  [['va','VAN'],['quiza','QUIZÁ'],['no','NO']].forEach(([k, t]) => { const cs = misCartas().filter(c => dec(c.id).estado === k); if (!cs.length) return; L.push('', `${t} (${cs.length}):`); cs.forEach(c => { const d = dec(c.id); L.push(`• ${COD(c.id)} ${c.titulo}${d.cuida ? ' · cuida: ' + d.cuida : ''}${d.nota ? ' · ' + d.nota : ''}`); }); });
  return L.join('\n');
}
function codigo(){ const dec2 = {}; Object.keys(S.dec).forEach(k => { if (S.dec[k].estado) dec2[k] = S.dec[k]; }); return 'BARAJA·' + btoa(unescape(encodeURIComponent(JSON.stringify({equipo:S.equipo, dec:dec2, nuevas:S.nuevas})))); }

/* ---------- ronda 2 ---------- */
let retroEq = 0, retroCarta = '', retroTipo = 'falta';
async function renderRetro(){
  const e = equipo(); const otros = EQUIPOS.filter(x => x.n !== e.n); if (!retroEq) retroEq = otros[0].n; const oe = EQUIPOS.find(x => x.n === retroEq);
  $('#main').innerHTML = `<div class="pant"><h2>Ronda 2</h2><p class="b">Mientras otro equipo presenta, déjale una tarjeta: <b>falta</b> (algo que no vieron) o <b>choca con lo mío</b> (se encima con lo tuyo).</p>
    <div class="retro-sel">${otros.map(x => `<button class="${retroEq === x.n ? 'on' : ''}" style="--eqc:${x.color}" onclick="retroEq=${x.n};retroCarta='';render()">Equipo ${x.n}</button>`).join('')}</div>
    <div id="retroLista">${API ? '<div class="vacio">Cargando lo que decidió el equipo ' + retroEq + '…</div>' : ''}</div>
    <div class="rform" style="--eqc:${oe.color}"><div class="dos"><button class="falta${retroTipo === 'falta' ? ' on' : ''}" onclick="retroTipo='falta';render()">Falta</button><button class="choca${retroTipo === 'choca' ? ' on' : ''}" onclick="retroTipo='choca';render()">Choca con lo mío</button></div>
      <div id="retroSobre" style="font-size:.8rem;color:var(--ink-soft);margin-bottom:6px">${retroCarta ? 'Sobre la carta ' + COD(retroCarta) : 'Sobre el conjunto del equipo ' + retroEq + (API ? ' (toca una carta arriba para que sea sobre ella)' : '')}</div>
      <textarea id="retroTxt" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;min-height:60px" placeholder="${retroTipo === 'falta' ? 'Qué falta y por qué importa' : 'Con qué pieza tuya choca y qué propones'}"></textarea>
      <div class="acciones" style="margin-bottom:0"><button class="btn ${retroTipo === 'falta' ? 'amber' : 'rojo'}" onclick="enviarRetro()">Mandar al equipo ${retroEq}</button></div></div>
    <div id="retroEnviadas"></div></div>`;
  $('#pie').innerHTML = `<button class="sig suave" onclick="ir('van')">‹ Nuestras cartas</button>`;
  pintarEnviadas();
  if (!API) return;
  try {
    const j = await get({action:'equipo', equipo:retroEq}); if (!j.ok) throw new Error(j.error);
    SV.otros[retroEq] = j;
    const cartas = D.cards.concat((j.nuevas || []).map(n => cartaNueva(Object.assign({comp:oe.comps[oe.comps.length - 1]}, n))));
    const van = (j.decisiones || []).filter(d => d.estado === 'va').map(d => Object.assign({c:cartas.find(c => c.id === d.carta)}, d)).filter(x => x.c);
    const el = $('#retroLista'); if (!el || retroEq !== j.equipo) return;
    el.innerHTML = van.length ? '<div class="lista">' + van.map(x => `<button class="fila" style="--c:${compDe(x.c).color};--cl:${compDe(x.c).claro};${retroCarta === x.carta ? 'outline:2px solid ' + oe.color : ''}" onclick="retroCarta=retroCarta==='${x.carta}'?'':'${x.carta}';render()"><div class="cod">${COD(x.carta)}</div><div><h3>${esc(x.c.titulo)}</h3><div class="det">${x.cuida ? `cuida <b>${esc(x.cuida)}</b>` : ''}${x.nota ? `<br>${esc(x.nota)}` : ''}</div></div></button>`).join('') + '</div>' : `<div class="vacio">El equipo ${retroEq} todavía no tiene cartas en «va».</div>`;
  } catch(e) { const el = $('#retroLista'); if (el) el.innerHTML = '<div class="vacio">No se pudo leer la hoja. Mira la pantalla y deja tu tarjeta.</div>'; }
}
async function enviarRetro(){
  const txt = $('#retroTxt').value.trim(); if (!txt) { toast('Escribe la tarjeta.'); return; }
  const r = {id:'r' + Date.now().toString(36), de:S.equipo, para:retroEq, carta:retroCarta, tipo:retroTipo, texto:txt.slice(0, 600), quien:S.quien, fecha:Date.now(), enviada:false};
  S.retroEnv.push(r); save(); $('#retroTxt').value = ''; pintarEnviadas();
  if (!API) { toast('Guardada en este teléfono. Léela en voz alta al equipo ' + retroEq + '.'); return; }
  try { await post({action:'retro', de:r.de, para:r.para, carta:r.carta, tipo:r.tipo, texto:r.texto, quien:r.quien, id:r.id}); r.enviada = true; save(); pintarEnviadas(); toast('Tarjeta enviada al equipo ' + retroEq + '.'); }
  catch(e) { toast('No salió: guardada en este teléfono. Vuelve a intentar.'); }
}
async function reenviar(){ for (const r of S.retroEnv.filter(x => !x.enviada)) { try { await post({action:'retro', de:r.de, para:r.para, carta:r.carta, tipo:r.tipo, texto:r.texto, quien:r.quien, id:r.id}); r.enviada = true; } catch(e) {} } save(); pintarEnviadas(); }
function pintarEnviadas(){
  const el = $('#retroEnviadas'); if (!el) return; const mias = S.retroEnv.filter(r => r.para === retroEq); const pend = S.retroEnv.filter(r => !r.enviada).length;
  el.innerHTML = mias.length ? `<h2 style="margin-top:22px;font-size:1.1rem">Tus tarjetas para el equipo ${retroEq}</h2>${mias.map(r => `<div class="rt ${r.tipo}"><b>${r.tipo === 'choca' ? 'Choca con lo mío' : 'Falta'}</b>${r.carta ? ' · ' + COD(r.carta) : ''}: ${esc(r.texto)}${r.enviada ? '' : ' <span style="color:var(--amber-dark)">(sin enviar)</span>'}</div>`).join('')}${pend && API ? '<div class="acciones"><button class="btn ghost" onclick="reenviar()">Reintentar las que no salieron</button></div>' : ''}` : '';
}

/* ---------- arranque ---------- */
document.addEventListener('keydown', e => { if (vista !== 'baraja' || /INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') mover(1); if (e.key === 'ArrowLeft') mover(-1); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { poll(); enviar(); } });
render();
if (!S.equipo) abrirEntrar();
if (API) { poll(); setInterval(poll, 12000); if (Object.keys(S.pend).length || Object.keys(S.pendN).length) enviar(); if (S.retroEnv.some(r => !r.enviada)) reenviar(); }
</script>
</body>
</html>
