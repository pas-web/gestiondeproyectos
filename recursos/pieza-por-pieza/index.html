/* La mochila del gestor · estilos comunes
   Dos superficies: el banco de trabajo (donde se llena) y la hoja (lo que se entrega).
   El banco usa los colores del curso; la hoja usa solo el color de quien la firma. */

:root {
  color-scheme: light;
  --petroleo: #0B3C49;
  --verde: #0F6E6E;
  --verde-hondo: #0A5555;
  --arena: #D9A441;
  --tinta: #1C2B28;
  --tinta-2: #44584F;
  --tenue: #6A7D77;
  --plano: #ECF1EE;
  --linea: #D3DFDA;
  --campo-borde: #BFCFC9;
  --kraft: #DDC398;
  --kraft-solapa: #CFAE7E;
  --kraft-borde: #B38D5B;
  --kraft-tinta: #3A2913;
  --kraft-tenue: #6B5130;
  --aviso: #8A3B2B;
  --aviso-fondo: #FBEDE8;
  --ojo: #7A5A12;
  --ojo-fondo: #FBF3DF;
  --bien: #1F5A34;
  --bien-fondo: #E6F2EA;
  --sombra-hoja: 0 1px 2px rgba(11, 60, 73, .10), 0 12px 32px -8px rgba(11, 60, 73, .22);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px; line-height: 1.5; color: var(--tinta); background: var(--plano);
}
a { color: var(--verde); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- La barra de arriba ---------- */
.barra {
  position: sticky; top: 0; z-index: 30;
  background: var(--petroleo); color: #E8F1EE;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px; min-height: 58px;
}
.barra .casa { display: flex; align-items: center; gap: 8px; color: #E8F1EE; text-decoration: none; font-size: 14px; opacity: .85; white-space: nowrap; }
.barra .casa:hover { opacity: 1; }
.barra .casa svg { width: 22px; height: 22px; }
.barra .herramienta { font-size: 19px; font-weight: 500; letter-spacing: -.005em; padding-left: 14px; border-left: 1px solid rgba(232, 241, 238, .25); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra .acciones { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.barra .estado { font-size: 13px; opacity: .7; white-space: nowrap; }
.btn-barra {
  background: transparent; color: #E8F1EE; border: 1px solid rgba(232, 241, 238, .4);
  border-radius: 8px; padding: 7px 12px; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn-barra:hover { background: rgba(255, 255, 255, .08); border-color: rgba(232, 241, 238, .7); }
@media (max-width: 640px) {
  .barra { gap: 10px; padding: 0 12px; }
  .barra .casa span, .barra .estado { display: none; }
  .barra .herramienta { font-size: 17px; padding-left: 10px; }
}

/* ---------- El banco: formulario a la izquierda, hoja a la derecha ---------- */
.banco {
  display: grid; grid-template-columns: minmax(0, 580px) minmax(0, 1fr);
  gap: 32px; max-width: 1560px; margin: 0 auto; padding: 24px 28px 110px; align-items: start;
}
.panel-hoja { position: sticky; top: 76px; }
@media (max-width: 1020px) {
  .banco { grid-template-columns: minmax(0, 1fr); padding: 16px 14px 120px; gap: 18px; }
  .panel-hoja { position: static; }
  body[data-vista="llenar"] .panel-hoja { position: absolute; left: -12000px; top: 0; width: 100%; visibility: hidden; }
  body[data-vista="hoja"] .formulario { display: none; }
}

/* Introducción corta de cada herramienta */
.entrada { margin: 2px 0 18px; }
.entrada p { margin: 0; color: var(--tinta-2); font-size: 15.5px; max-width: 60ch; }
.entrada .acciones-entrada { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* ---------- Los pasos del formulario ---------- */
.paso { border-top: 1px solid var(--linea); padding: 4px 0 18px; }
.paso > summary, .paso > .cabeza {
  list-style: none; display: flex; align-items: baseline; gap: 12px;
  padding: 16px 0 6px; cursor: pointer;
}
.paso > .cabeza { cursor: default; }
.paso > summary::-webkit-details-marker { display: none; }
.paso .n { font-weight: 600; font-size: 26px; line-height: 1; color: var(--arena); min-width: 22px; font-variant-numeric: tabular-nums; }
.paso h2 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: -.005em; color: var(--petroleo); }
.paso .resumen-paso { margin-left: auto; font-size: 13.5px; color: var(--tenue); text-align: right; }
.paso > summary .resumen-paso::after { content: "Abrir"; margin-left: 10px; color: var(--verde); font-weight: 500; }
.paso[open] > summary .resumen-paso::after { content: "Cerrar"; }
.paso .guia { font-size: 14.5px; color: var(--tinta-2); margin: 0 0 12px 34px; max-width: 58ch; }
.paso .cuerpo { margin-left: 34px; }
@media (max-width: 640px) {
  .paso .guia, .paso .cuerpo { margin-left: 0; }
  .paso h2 { font-size: 18px; }
}

/* ---------- Campos ---------- */
.campos { display: grid; gap: 12px 14px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.campo { grid-column: span 6; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo.c3 { grid-column: span 3; }
.campo.c2 { grid-column: span 2; }
.campo.c4 { grid-column: span 4; }
@media (max-width: 520px) { .campo.c3, .campo.c2, .campo.c4 { grid-column: span 6; } .campo.c2.par { grid-column: span 3; } }
.campo > label, .campo > .etiqueta { font-size: 14px; font-weight: 500; color: var(--tinta-2); }
.campo .ayuda, .ayuda { font-size: 13.5px; color: var(--tenue); line-height: 1.45; }
input[type=text], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 11px; background: #fff;
  border: 1px solid var(--campo-borde); border-radius: 8px; font-size: 16px; line-height: 1.35;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(15, 110, 110, .18); }
input::placeholder, textarea::placeholder { color: #9AABA5; }
input.monto, input.cant { text-align: right; font-variant-numeric: tabular-nums; }
.con-prefijo { position: relative; }
.con-prefijo > span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--tenue); pointer-events: none; }
.con-prefijo > input { padding-left: 24px; }
.palomita { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; padding: 4px 0; }
.palomita input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--verde); flex: none; }

/* Selector de opciones (radio con botones) */
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opciones label { position: relative; }
.opciones input { position: absolute; opacity: 0; pointer-events: none; }
.opciones span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 7px 14px;
  border: 1px solid var(--campo-borde); border-radius: 999px; background: #fff; cursor: pointer; font-size: 15px;
}
.opciones input:checked + span { background: var(--petroleo); border-color: var(--petroleo); color: #fff; }
.opciones input:focus-visible + span { outline: 2px solid var(--verde); outline-offset: 2px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--verde);
  background: var(--verde); color: #fff; font-weight: 500; font-size: 15.5px; cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--verde-hondo); border-color: var(--verde-hondo); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.claro { background: #fff; color: var(--petroleo); border-color: var(--campo-borde); }
.btn.claro:hover { border-color: var(--petroleo); background: #fff; }
.btn.chico { min-height: 36px; padding: 6px 12px; font-size: 14.5px; border-radius: 8px; }
.btn.peligro { background: #fff; color: var(--aviso); border-color: #E2C1B8; }
.btn.peligro:hover { border-color: var(--aviso); background: #fff; }
.btn-texto { background: none; border: none; padding: 6px 2px; color: var(--verde); font-weight: 500; cursor: pointer; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.btn-texto.peligro { color: var(--aviso); }

/* ---------- Renglones (listas que se agregan y se quitan) ---------- */
.renglones { display: flex; flex-direction: column; gap: 8px; }
.renglon { display: grid; gap: 8px; align-items: center; }
button.quitar {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: transparent; padding: 0;
  color: var(--tenue); cursor: pointer; font-size: 22px; line-height: 1; display: grid; place-items: center;
}
button.quitar:hover { color: var(--aviso); border-color: #E2C1B8; background: #fff; }
.encabezado-renglones { display: grid; gap: 8px; font-size: 12.5px; color: var(--tenue); padding: 0 2px; }
.sugerencias { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; align-items: center; }
.sugerencias .rot { font-size: 13px; color: var(--tenue); margin-right: 2px; }
.sugerencias button {
  border: 1px dashed var(--campo-borde); background: transparent; border-radius: 999px; padding: 5px 11px;
  font-size: 14px; cursor: pointer; color: var(--tinta-2);
}
.sugerencias button:hover { border-style: solid; border-color: var(--verde); color: var(--verde); }
.agregar { margin-top: 8px; }

/* ---------- El sobre: lo que el cliente no ve ---------- */
.sobre {
  position: relative; background: var(--kraft); color: var(--kraft-tinta);
  border: 1px solid var(--kraft-borde); border-radius: 4px 4px 12px 12px;
  padding: 58px 22px 22px; margin: 14px 0 6px;
}
.sobre::before {
  content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 46px;
  background: var(--kraft-solapa); border: 1px solid var(--kraft-borde); border-bottom: none;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 34%, 0 100%); border-radius: 4px 4px 0 0;
}
.sobre .rotulo { position: absolute; top: 12px; left: 22px; right: 22px; display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; z-index: 1; }
.sobre .rotulo b { font-weight: 600; }
.sobre .rotulo span { color: var(--kraft-tenue); }
.sobre h3 { font-size: 16.5px; font-weight: 600; margin: 18px 0 8px; color: var(--kraft-tinta); }
.sobre h3:first-of-type { margin-top: 0; }
.sobre .ayuda, .sobre .campo > label, .sobre .encabezado-renglones { color: var(--kraft-tenue); }
.sobre .campo > label { color: var(--kraft-tinta); }
.sobre input, .sobre select { border-color: var(--kraft-borde); }
.sobre .sugerencias button { border-color: var(--kraft-borde); color: var(--kraft-tinta); }
.sobre .sugerencias button:hover { border-color: var(--kraft-tinta); }
.sobre .btn.claro { border-color: var(--kraft-borde); }
.sobre hr { border: none; border-top: 1px dashed var(--kraft-borde); margin: 18px 0; }
.subtotal-sobre { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0 0; color: var(--kraft-tinta); }
.subtotal-sobre b { font-variant-numeric: tabular-nums; font-weight: 600; }

/* La cuenta: el resultado del sobre */
.cuenta { background: #FFF9EE; border: 1px solid var(--kraft-borde); border-radius: 10px; padding: 16px 18px; }
.cuenta .grande { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cuenta .grande .t { font-size: 15px; color: var(--kraft-tenue); }
.cuenta .grande .v { font-size: 34px; font-weight: 600; letter-spacing: -.01em; color: var(--kraft-tinta); }
.cuenta .linea-cuenta { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 3px 0; border-bottom: 1px dotted #D9C4A0; }
.cuenta .linea-cuenta:last-child { border-bottom: none; }
.cuenta .linea-cuenta b { font-weight: 500; font-variant-numeric: tabular-nums; }
.cuenta .nota { font-size: 13.5px; color: var(--kraft-tenue); margin: 10px 0 0; }

/* Barra segmentada: una sola cosa partida en sus piezas */
.segmentos { display: flex; gap: 2px; height: 28px; margin: 12px 0 8px; }
.segmentos > div { border-radius: 4px; min-width: 0; display: flex; align-items: center; padding: 0 8px; font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: visible; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--tinta-2); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- Revisión: los avisos ---------- */
.revision { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.revision li { border-radius: 8px; padding: 10px 12px 10px 38px; position: relative; font-size: 14.5px; line-height: 1.45; }
.revision li::before { position: absolute; left: 12px; top: 10px; font-weight: 700; width: 18px; text-align: center; }
.revision li.bien { background: var(--bien-fondo); color: var(--bien); }
.revision li.bien::before { content: "✓"; }
.revision li.mal { background: var(--aviso-fondo); color: var(--aviso); }
.revision li.mal::before { content: "!"; }
.revision li.ojo { background: var(--ojo-fondo); color: var(--ojo); }
.revision li.ojo::before { content: "?"; }
.revision li b { font-weight: 600; margin-right: 4px; }

/* ---------- El panel de la hoja ---------- */
.mesa-hoja { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.mesa-hoja .opciones span { min-height: 38px; }
.mesa-hoja .derecha { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.marco-hoja { position: relative; overflow: hidden; }
.marco-hoja > .hoja { position: absolute; left: 0; top: 0; transform-origin: top left; }
.pie-hoja { font-size: 13px; color: var(--tenue); margin-top: 10px; }
.pista-impresion { font-size: 13px; color: var(--tenue); margin: 8px 0 0; }

/* ---------- El conmutador del celular ---------- */
.conmutador {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: rgba(255, 255, 255, .97); border-top: 1px solid var(--linea);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px; align-items: center;
  box-shadow: 0 -6px 18px rgba(11, 60, 73, .08);
}
.conmutador .dos { display: flex; background: var(--plano); border-radius: 10px; padding: 3px; flex: 1; }
.conmutador .dos button { flex: 1; border: none; background: transparent; border-radius: 8px; padding: 9px 6px; font-size: 15px; cursor: pointer; color: var(--tinta-2); }
.conmutador .dos button[aria-pressed="true"] { background: #fff; color: var(--petroleo); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
@media (max-width: 1020px) { .conmutador { display: flex; } }

/* ---------- Cajón (lista de documentos) y avisos flotantes ---------- */
dialog.cajon {
  border: none; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 24px)); max-height: min(80vh, 720px);
  box-shadow: 0 24px 64px rgba(11, 60, 73, .35); color: var(--tinta);
}
dialog.cajon::backdrop { background: rgba(11, 60, 73, .45); }
.cajon .cabeza-cajon { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--linea); position: sticky; top: 0; background: #fff; }
.cajon .cabeza-cajon h2 { font-size: 19px; font-weight: 500; margin: 0; color: var(--petroleo); }
.cajon .cabeza-cajon .cerrar { margin-left: auto; }
.cajon .cuerpo-cajon { padding: 8px 18px 18px; overflow: auto; }
.cajon .acciones-cajon { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 6px; }
.lista-docs { list-style: none; margin: 8px 0 0; padding: 0; }
.lista-docs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--linea); }
.lista-docs li.actual .t::after { content: "abierto ahora"; margin-left: 8px; font-size: 12px; color: var(--verde); font-weight: 500; }
.lista-docs .t { font-weight: 500; }
.lista-docs .d { font-size: 13.5px; color: var(--tenue); grid-column: 1; }
.lista-docs .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.lista-docs .a { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; }
.vacio { color: var(--tenue); font-size: 15px; padding: 12px 0; }

.flotante {
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--petroleo); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 15px; z-index: 60;
  box-shadow: 0 10px 30px rgba(11, 60, 73, .3); transition: opacity .18s, transform .18s; pointer-events: none; max-width: calc(100vw - 32px);
}
.flotante.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
.flotante.mal { background: var(--aviso); }
@media (min-width: 1021px) { .flotante { bottom: 28px; } }

/* ---------- El membrete en el formulario ---------- */
.logo-zona { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logo-vista { width: 76px; height: 76px; border-radius: 10px; border: 1px dashed var(--campo-borde); background: #fff; display: grid; place-items: center; overflow: hidden; flex: none; }
.logo-vista img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logo-vista .mono { width: 100%; height: 100%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 26px; letter-spacing: .02em; }
.colores { display: flex; flex-wrap: wrap; gap: 8px; }
.colores label { position: relative; }
.colores input { position: absolute; opacity: 0; pointer-events: none; }
.colores span { display: block; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--campo-borde); }
.colores input:checked + span { box-shadow: 0 0 0 2px var(--tinta); }
.colores input:focus-visible + span { outline: 2px solid var(--verde); outline-offset: 3px; }

/* ===================================================================
   LA HOJA: lo que se entrega. Medidas en pulgadas y puntos, como el papel.
   =================================================================== */
.hoja {
  --acento: #0B3C49;
  --acento-suave: color-mix(in srgb, var(--acento) 9%, #fff);
  --acento-linea: color-mix(in srgb, var(--acento) 55%, #fff);
  --t-tinta: #1D2A2E;
  --t-2: #4B5A5E;
  --t-tenue: #7B898C;
  --t-filete: #DCE2E3;
  position: relative; width: 8.5in; min-height: 11in; background: #fff; color: var(--t-tinta);
  font-family: 'Jost', system-ui, sans-serif; font-size: 10pt; line-height: 1.42;
  box-shadow: var(--sombra-hoja); text-align: left;
  font-variant-numeric: lining-nums;
}
.hoja.horizontal { width: 11in; min-height: 8.5in; }
.hoja table.pagina { width: 100%; border-collapse: collapse; }
.hoja table.pagina > thead > tr > td, .hoja table.pagina > tfoot > tr > td { padding: 0; }
.hoja .m-sup { height: .55in; }
.hoja .m-inf { height: .62in; }
.hoja .pie-doc { position: absolute; left: .65in; right: .65in; bottom: .3in; display: flex; justify-content: space-between; gap: .3in; font-size: 7.5pt; color: var(--t-tenue); }
.hoja td.contenido { padding: 0 .65in; vertical-align: top; }
.hoja.horizontal td.contenido { padding-left: .5in; padding-right: .5in; }
.hoja.horizontal .pie-doc { left: .5in; right: .5in; }
.hoja h1, .hoja h2, .hoja h3, .hoja p { margin: 0; }
.hoja .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* Membrete */
.hoja .membrete { display: flex; gap: .22in; align-items: center; padding-bottom: .16in; border-bottom: .75pt solid var(--acento-linea); }
.hoja .membrete .logo { width: .86in; height: .86in; flex: none; display: grid; place-items: center; }
.hoja .membrete .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.hoja .membrete .logo .mono { width: .78in; height: .78in; border-radius: 50%; background: var(--acento); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 22pt; letter-spacing: .02em; }
.hoja .membrete .quien { flex: 1; min-width: 0; }
.hoja .membrete .nombre { font-size: 15pt; font-weight: 600; line-height: 1.15; letter-spacing: -.005em; }
.hoja .membrete .giro { font-size: 9.5pt; color: var(--t-2); margin-top: 1pt; }
.hoja .membrete .contacto { font-size: 8.3pt; color: var(--t-2); margin-top: 4pt; line-height: 1.5; }
.hoja .membrete .contacto span + span::before { content: ""; display: inline-block; width: 3pt; height: 3pt; border-radius: 50%; background: var(--acento-linea); margin: 0 6pt 1.5pt; vertical-align: middle; }
.hoja .membrete .doc { text-align: right; flex: none; }
.hoja .membrete .doc .tipo { font-size: 22pt; font-weight: 500; line-height: 1; color: var(--acento); letter-spacing: -.01em; }
.hoja .membrete .doc .folio { font-size: 9pt; color: var(--t-2); margin-top: 5pt; }
.hoja .membrete .doc .folio b { color: var(--t-tinta); font-weight: 600; }
.hoja.compacta .membrete .logo { width: .62in; height: .62in; }
.hoja.compacta .membrete .logo .mono { width: .58in; height: .58in; font-size: 16pt; }
.hoja.compacta .membrete .nombre { font-size: 12.5pt; }

/* Bloques de datos */
.hoja .datos { display: grid; grid-template-columns: 1.25fr 1fr; gap: .3in; margin: .22in 0 .2in; }
.hoja .rot { font-size: 7.8pt; color: var(--t-tenue); margin-bottom: 1.5pt; }
.hoja .dato-grande { font-size: 12pt; font-weight: 500; line-height: 1.25; }
.hoja .dato { font-size: 9.5pt; color: var(--t-2); }
.hoja .pares { display: grid; grid-template-columns: auto 1fr; gap: 2pt 10pt; font-size: 9pt; align-content: start; }
.hoja .pares dt { color: var(--t-tenue); }
.hoja .pares dd { margin: 0; color: var(--t-tinta); }
.hoja .titulo-doc { font-size: 13pt; font-weight: 500; margin: 0 0 3pt; }
.hoja .bajada { font-size: 9.5pt; color: var(--t-2); max-width: 6.2in; }

/* Tablas */
.hoja table.tabla { width: 100%; border-collapse: collapse; margin: .1in 0 0; font-size: 9.2pt; }
.hoja table.tabla thead th {
  text-align: left; font-weight: 500; font-size: 7.8pt; color: var(--t-tenue);
  padding: 0 6pt 4pt; border-bottom: 1pt solid var(--acento);
}
.hoja table.tabla thead th.num { text-align: right; }
.hoja table.tabla td { padding: 5.5pt 6pt; border-bottom: .5pt solid var(--t-filete); vertical-align: top; }
.hoja table.tabla tr { break-inside: avoid; }
.hoja table.tabla td:first-child, .hoja table.tabla th:first-child { padding-left: 0; }
.hoja table.tabla td:last-child, .hoja table.tabla th:last-child { padding-right: 0; }
.hoja table.tabla .concepto b { font-weight: 500; }
.hoja table.tabla .concepto small { display: block; font-size: 8.4pt; color: var(--t-2); margin-top: 1pt; line-height: 1.35; }
.hoja table.tabla tr.grupo { break-after: avoid; }
.hoja table.tabla tr.sub, .hoja table.tabla tr.total { break-before: avoid; }
.hoja table.tabla tr.grupo td { font-weight: 600; font-size: 8.6pt; color: var(--acento); padding-top: 9pt; border-bottom-color: var(--acento-linea); }
.hoja table.tabla tr.sub td { font-weight: 500; background: var(--acento-suave); }
.hoja table.tabla tr.total td { font-weight: 600; font-size: 10pt; border-top: 1pt solid var(--acento); border-bottom: none; }

/* Totales a la derecha */
.hoja .totales { margin: .12in 0 0 auto; width: 3.1in; font-size: 9.5pt; }
.hoja .totales .fila { display: flex; justify-content: space-between; padding: 3pt 0; }
.hoja .totales .fila b { font-weight: 500; font-variant-numeric: tabular-nums; }
.hoja .totales .fila.gran { margin-top: 3pt; padding: 7pt 9pt; background: var(--acento); color: #fff; border-radius: 3pt; font-size: 12pt; font-weight: 600; }
.hoja .totales .fila.gran b { font-weight: 600; }
.hoja .letra { font-size: 7.9pt; color: var(--t-2); text-align: right; margin-top: 4pt; letter-spacing: .01em; }

/* Textos de condiciones */
.hoja .seccion { margin-top: .2in; break-inside: avoid; }
.hoja .seccion h3 { font-size: 9pt; font-weight: 600; color: var(--acento); margin-bottom: 3pt; }
.hoja .seccion p, .hoja .seccion li { font-size: 8.8pt; color: var(--t-2); }
.hoja .seccion ul { margin: 0; padding-left: 12pt; }
.hoja .seccion li { margin: 1pt 0; }
.hoja .dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: .3in; }

/* Cierre: condiciones a la izquierda, firma a la derecha */
.hoja .cierre { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: .4in; align-items: end; margin-top: .2in; break-inside: avoid; }
.hoja .cierre > .seccion { margin-top: 0; }
.hoja .cierre .firmas { margin-top: 0; justify-content: flex-end; }
.hoja .cierre .firma { width: 100%; max-width: 2.6in; }

/* Firmas */
.hoja .firmas { display: flex; gap: .6in; margin-top: .35in; break-inside: avoid; flex-wrap: wrap; }
.hoja .firma { width: 2.6in; text-align: center; }
.hoja .firma .trazo { height: .55in; display: flex; align-items: flex-end; justify-content: center; border-bottom: .75pt solid var(--t-tinta); margin-bottom: 4pt; }
.hoja .firma .trazo img { max-height: .6in; max-width: 2.2in; object-fit: contain; }
.hoja .firma .quien-firma { font-size: 9.2pt; font-weight: 500; }
.hoja .firma .cargo { font-size: 8pt; color: var(--t-2); }
.hoja .firma .que { font-size: 7.8pt; color: var(--t-tenue); margin-bottom: 2pt; }

.hoja .vacio-hoja { color: var(--t-tenue); font-size: 10pt; border: 1pt dashed var(--t-filete); border-radius: 6pt; padding: .3in; text-align: center; margin-top: .3in; }
.hoja .marca-muestra { display: inline-block; font-size: 7.5pt; color: var(--t-tenue); border: .5pt solid var(--t-filete); border-radius: 99pt; padding: 1pt 7pt; margin-bottom: 6pt; }

/* ---------- La impresión ---------- */
#impresion { display: none; }
@media print {
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  body > *:not(#impresion) { display: none !important; }
  #impresion { display: block !important; }
  #impresion .hoja { box-shadow: none !important; transform: none !important; position: static !important; min-height: 0 !important; margin: 0 !important; }
  #impresion .hoja .pie-doc { position: fixed; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

/* La mochila del gestor · una cosa a la vez
   La tarjeta de la pregunta, el camino de arriba, la ventanita del celular,
   la hoja con la parte en foco y las salidas del final. */

/* ---------- El banco cuando la guía manda ---------- */
body.guiada .banco { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 36px; padding-bottom: 60px; }
body.guiada .panel-hoja { top: 74px; max-height: calc(100vh - 88px); overflow: auto; padding: 2px 14px 18px 4px; overscroll-behavior: contain; scrollbar-width: thin; }
body.guiada .panel-hoja .mesa-hoja { position: sticky; top: -2px; z-index: 2; background: var(--plano); padding: 8px 0 10px; margin-bottom: 4px; }
body.guiada .panel-hoja .mesa-hoja .rot-hoja { font-size: 14px; color: var(--tenue); }
.formulario.guia { position: relative; }

/* ---------- El camino: los tramos del documento ---------- */
.camino { margin: 6px 0 18px; }
.camino-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.camino-lista button {
  display: inline-flex; align-items: center; gap: 7px; border: none; background: none; padding: 3px 0;
  font-size: 14px; color: var(--tenue); cursor: pointer; text-align: left; line-height: 1.2;
}
.camino-lista button:hover .nom { color: var(--petroleo); }
.camino-lista .num {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--campo-borde); background: #fff;
  display: grid; place-items: center; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tenue);
}
.camino-lista button.actual { color: var(--petroleo); font-weight: 600; }
.camino-lista button.actual .num { background: var(--petroleo); border-color: var(--petroleo); color: #fff; }
.camino-lista button.hecho { color: var(--tinta-2); }
.camino-lista button.hecho .num { background: var(--bien-fondo); border-color: #A9CDB6; color: transparent; position: relative; }
.camino-lista button.hecho .num::after { content: ""; position: absolute; left: 6.5px; top: 3.5px; width: 5px; height: 9px; border: solid var(--bien); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.avance { height: 3px; background: var(--linea); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.avance i { display: block; height: 100%; width: 0; background: var(--verde); border-radius: 3px; transition: width .35s ease; }
.camino-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; font-size: 13px; color: var(--tenue); }
.camino-pie .btn-texto { font-size: 13.5px; padding: 2px 0; }
@media (max-width: 640px) {
  .camino-lista { gap: 6px 8px; }
  .camino-lista button:not(.actual) .nom { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .camino-lista button.actual .nom { font-size: 14.5px; }
}

/* ---------- La tarjeta de la pregunta ---------- */
.guia .pregunta {
  position: relative; background: #fff; border: 1px solid var(--linea); border-radius: 16px;
  padding: 24px 28px 26px; box-shadow: 0 1px 2px rgba(11, 60, 73, .05), 0 10px 28px -18px rgba(11, 60, 73, .28);
}
.guia .pregunta[hidden] { display: none; }
.guia .pregunta .donde { display: flex; gap: 10px; align-items: baseline; margin: 0 0 8px; font-size: 14px; }
.guia .pregunta .donde .tramo { color: var(--verde); font-weight: 600; }
.guia .pregunta .donde .de { color: var(--tenue); font-variant-numeric: tabular-nums; }
.guia .pregunta h2 { font-size: 27px; line-height: 1.16; font-weight: 500; letter-spacing: -.014em; color: var(--petroleo); margin: 0 0 8px; max-width: 22ch; text-wrap: balance; }
.guia .pregunta .porque { font-size: 16px; line-height: 1.5; color: var(--tinta-2); margin: 0 0 20px; max-width: 50ch; }
.guia .pregunta h3 { font-size: 16px; font-weight: 600; color: var(--petroleo); margin: 20px 0 8px; }
.guia [hidden] { display: none !important; }
.guia .pregunta > .campos + .campos, .guia .pregunta > .campo + .campo, .guia .pregunta > .campos + .campo, .guia .pregunta > .campo + .campos { margin-top: 14px; }
.guia .pregunta > p:last-child { margin-bottom: 0; }
input.grande, textarea.grande { font-size: 19px; min-height: 56px; padding: 12px 14px; border-radius: 10px; }
textarea.grande { min-height: 120px; line-height: 1.45; }
.guia .campo > label { font-size: 14.5px; }
@media (max-width: 640px) {
  .guia .pregunta { padding: 18px 16px 20px; border-radius: 14px; }
  .guia .pregunta h2 { font-size: 23px; }
  .guia .pregunta .porque { font-size: 15.5px; margin-bottom: 16px; }
}
.pregunta.entra { animation: entra .24s ease-out; }
.pregunta.entra-atras { animation: entra-atras .24s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes entra-atras { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }

/* Ejemplos que se tocan para llenar */
.ejemplos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.ejemplos > span { font-size: 13.5px; color: var(--tenue); margin-right: 2px; }
.ejemplos button {
  border: 1px dashed var(--campo-borde); background: transparent; border-radius: 999px; padding: 6px 12px;
  font-size: 14.5px; color: var(--tinta-2); cursor: pointer; text-align: left; line-height: 1.3;
}
.ejemplos button:hover { border-style: solid; border-color: var(--verde); color: var(--verde); }
details.mas { margin-top: 16px; }
details.mas > summary { cursor: pointer; color: var(--verde); font-weight: 500; font-size: 15px; list-style: none; }
details.mas > summary::-webkit-details-marker { display: none; }
details.mas > summary::before { content: "+ "; }
details.mas[open] > summary::before { content: "\2212  "; }
details.mas[open] > summary { margin-bottom: 12px; }

/* Lo que se está armando, dentro de la tarjeta: un renglón con su resultado */
.asi-va { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--plano); font-size: 15px; }
.asi-va b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--petroleo); white-space: nowrap; }
.asi-va span { color: var(--tinta-2); }

/* El sobre: las preguntas que solo ve quien cotiza */
.guia .pregunta.en-sobre { background: var(--kraft); border-color: var(--kraft-borde); color: var(--kraft-tinta); padding-top: 60px; box-shadow: 0 10px 28px -18px rgba(58, 41, 19, .5); }
.guia .pregunta.en-sobre::before {
  content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 44px; border-radius: 16px 16px 0 0;
  background: var(--kraft-solapa); border: 1px solid var(--kraft-borde); border-bottom: none;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 30%, 0 100%);
}
.guia .pregunta.en-sobre::after {
  content: "El sobre: solo tú lo ves"; position: absolute; top: 12px; right: 18px; font-size: 13px; font-weight: 500; color: var(--kraft-tinta);
}
.guia .pregunta.en-sobre .donde { position: absolute; top: 11px; left: 26px; }
.guia .pregunta.en-sobre .donde .tramo { color: var(--kraft-tinta); }
.guia .pregunta.en-sobre .donde .de, .guia .pregunta.en-sobre .porque, .guia .pregunta.en-sobre .ayuda, .guia .pregunta.en-sobre .encabezado-renglones { color: var(--kraft-tenue); }
.guia .pregunta.en-sobre h2, .guia .pregunta.en-sobre h3, .guia .pregunta.en-sobre .campo > label { color: var(--kraft-tinta); }
.guia .pregunta.en-sobre input, .guia .pregunta.en-sobre select { border-color: var(--kraft-borde); }
.guia .pregunta.en-sobre .sugerencias button, .guia .pregunta.en-sobre .ejemplos button { border-color: var(--kraft-borde); color: var(--kraft-tinta); }
.guia .pregunta.en-sobre .asi-va { background: #FFF9EE; border: 1px solid var(--kraft-borde); }
.guia .pregunta.en-sobre .asi-va b { color: var(--kraft-tinta); }
.guia .pregunta.en-sobre .btn.claro { border-color: var(--kraft-borde); }
@media (max-width: 640px) {
  .guia .pregunta.en-sobre { padding-top: 58px; }
  .guia .pregunta.en-sobre .donde { left: 16px; }
  .guia .pregunta.en-sobre::after { right: 14px; content: "Solo tú lo ves"; }
}

/* Lo que falta, cuando se quiere seguir sin llenarlo */
.falta { background: var(--ojo-fondo); color: var(--ojo); border-radius: 10px; padding: 10px 14px; font-size: 14.5px; margin: 12px 0 0; }

/* ---------- Los botones de abajo ---------- */
.pie-guia { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
.pie-guia .seguir { margin-left: auto; min-width: 150px; }
.pie-guia .ver-hoja { display: none; }
@media (max-width: 1020px) {
  body.guiada .banco { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-bottom: 104px; }
  .pie-guia {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0;
    background: rgba(255, 255, 255, .97); border-top: 1px solid var(--linea);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 18px rgba(11, 60, 73, .08);
  }
  .pie-guia .ver-hoja { display: inline-flex; padding-left: 12px; padding-right: 12px; }
  .pie-guia .seguir { flex: 1; min-width: 0; }
  .pie-guia .atras { padding-left: 12px; padding-right: 12px; }
  body.guiada .conmutador { display: none; }
  body.guiada[data-vista="hoja"] .conmutador { display: flex; }
  body.guiada[data-vista="hoja"] .pie-guia { display: none; }
}

/* ---------- La ventanita del celular: así va tu hoja ---------- */
.ventanita { display: none; }
@media (max-width: 1020px) {
  .ventanita { display: block; width: 100%; margin: 14px 0 0; border: 1px solid var(--linea); border-radius: 14px; background: #fff; padding: 10px 10px 8px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .ventanita .rot { display: block; font-size: 13px; color: var(--tenue); margin: 0 2px 6px; }
  .ventanita .marco-mini { display: block; position: relative; height: 190px; overflow: hidden; border-radius: 8px; background: var(--plano); }
  .ventanita .marco-mini .hoja { box-shadow: none; }
  .ventanita .ver { display: block; font-size: 13.5px; color: var(--verde); font-weight: 500; margin: 7px 2px 0; }
}

/* ---------- La hoja: la parte que se está escribiendo ---------- */
.hoja [data-parte] { transition: background-color .6s ease, box-shadow .6s ease; border-radius: 3pt; }
.hoja .en-foco { background-color: rgba(217, 164, 65, .13); box-shadow: 0 0 0 5pt rgba(217, 164, 65, .13); }
.hoja tr.en-foco { box-shadow: none; background-color: transparent; }
.hoja tr.en-foco > td { background-color: rgba(217, 164, 65, .13); }
.hoja tr.en-foco.late { animation: none; }
.hoja tr.en-foco.late > td { animation: latido-celda 1.1s ease-out; }
@keyframes latido-celda { 0% { background-color: rgba(217, 164, 65, .42); } 100% { background-color: rgba(217, 164, 65, .13); } }
.hoja .en-foco.late { animation: latido 1.1s ease-out; }
@keyframes latido {
  0% { background-color: rgba(217, 164, 65, .42); box-shadow: 0 0 0 7pt rgba(217, 164, 65, .36); }
  100% { background-color: rgba(217, 164, 65, .13); box-shadow: 0 0 0 5pt rgba(217, 164, 65, .13); }
}
#impresion .en-foco, #impresion [data-parte] { background-color: transparent !important; box-shadow: none !important; animation: none !important; }
#impresion tr.en-foco > td { background-color: transparent !important; animation: none !important; }

/* ---------- La tarjeta del membrete ---------- */
.tarjeta-membrete { display: flex; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 12px; background: var(--plano); border-left: 4px solid var(--acento, var(--petroleo)); }
.tm-logo { width: 64px; height: 64px; flex: none; display: grid; place-items: center; }
.tm-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tm-logo .mono { width: 60px; height: 60px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 22px; }
.tm-quien { min-width: 0; }
.tm-quien b { display: block; font-size: 18px; font-weight: 600; color: var(--tinta); line-height: 1.25; }
.tm-quien span { display: block; font-size: 14.5px; color: var(--tinta-2); }
.tm-quien small { display: block; font-size: 13px; color: var(--tenue); margin-top: 4px; line-height: 1.45; }
.cara { display: flex; flex-direction: column; gap: 18px; }

/* ---------- Una lista que se llena de uno en uno ---------- */
.rg-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rg-van { font-size: 14px; font-weight: 500; color: var(--tinta-2); margin: 18px 0 8px; }
.rg-mas { list-style: none; padding: 2px 0 0 38px; }
.rg-mas .btn-texto { font-size: 14px; }
.rg-fila .rg-aqui { font-size: 13px; color: var(--verde); font-weight: 500; padding: 6px; }
.rg-fila { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--plano); border-left: 4px solid var(--color, var(--campo-borde)); }
.rg-fila.actual { background: #fff; box-shadow: 0 0 0 2px var(--verde) inset; }
.rg-fila .rg-n { font-size: 13px; font-weight: 600; color: var(--tenue); font-variant-numeric: tabular-nums; text-align: center; }
.rg-fila .rg-t { font-size: 15px; font-weight: 500; color: var(--tinta); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rg-fila .rg-t.vacio-t { color: var(--tenue); font-weight: 400; }
.rg-fila .rg-d { grid-column: 2; font-size: 13px; color: var(--tenue); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rg-fila .rg-a { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 2px; }
.rg-fila .rg-a button { border: none; background: transparent; color: var(--verde); font-weight: 500; font-size: 14px; padding: 6px 6px; cursor: pointer; border-radius: 6px; }
.rg-fila .rg-a button:hover { background: rgba(15, 110, 110, .08); }
.rg-editor { border: 1px solid var(--campo-borde); border-radius: 12px; padding: 16px; background: #FBFCFC; }
.rg-editor .rg-cual { font-size: 14px; font-weight: 600; color: var(--verde); margin: 0 0 10px; }
.rg-editor .rg-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.rg-editor .rg-botones .peligro { margin-left: auto; }
.rg-vacio { font-size: 15px; color: var(--tenue); margin: 0 0 12px; }
.en-sobre .rg-fila { background: rgba(255, 249, 238, .7); }
.en-sobre .rg-editor { background: #FFF9EE; border-color: var(--kraft-borde); }

/* ---------- Revisar y entregar ---------- */
.entregas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.entrega {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: start; text-align: left;
  padding: 14px 16px; border: 1px solid var(--campo-borde); border-radius: 12px; background: #fff; cursor: pointer; font: inherit; color: inherit;
}
.entrega svg { grid-row: 1 / span 2; width: 30px; height: 30px; color: var(--verde); margin-top: 1px; }
.entrega .t { font-weight: 600; color: var(--petroleo); font-size: 16px; line-height: 1.25; }
.entrega .d { font-size: 13.5px; color: var(--tinta-2); line-height: 1.38; }
.entrega:hover { border-color: var(--petroleo); }
.entrega.principal { background: var(--petroleo); border-color: var(--petroleo); }
.entrega.principal svg, .entrega.principal .t { color: #fff; }
.entrega.principal .d { color: rgba(255, 255, 255, .82); }
.entrega.principal:hover { background: #072a33; }
.entrega.haciendo { opacity: .6; cursor: progress; }
@media (max-width: 520px) { .entregas { grid-template-columns: minmax(0, 1fr); } }
.pendientes { background: var(--ojo-fondo); color: var(--ojo); border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; font-size: 15px; }
.pendientes ul { margin: 6px 0 0; padding-left: 18px; }
.pendientes a { color: var(--ojo); font-weight: 500; }
.todo-listo { background: var(--bien-fondo); color: var(--bien); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-size: 15px; }
.guia .revision { margin-bottom: 16px; }

/* ---------- El índice de todos los pasos ---------- */
.indice-pasos { list-style: none; margin: 8px 0 0; padding: 0; }
.indice-pasos > li { padding: 10px 0; border-top: 1px solid var(--linea); }
.indice-pasos > li > b { font-weight: 600; color: var(--petroleo); }
.indice-pasos ul { list-style: none; margin: 4px 0 0; padding: 0 0 0 4px; }
.indice-pasos ul li { position: relative; padding-left: 22px; }
.indice-pasos ul li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--campo-borde); }
.indice-pasos ul li.listo::before { background: var(--bien); border-color: var(--bien); }
.indice-pasos ul li.aqui .btn-texto { font-weight: 600; color: var(--petroleo); }
.indice-pasos .btn-texto { text-align: left; text-decoration: none; font-weight: 400; color: var(--tinta); }
.indice-pasos .btn-texto:hover { text-decoration: underline; }

/* Huecos: el lugar de algo que todavía no se llena. Solo se ve cuando se está en esa pregunta. */
.hoja .hueco { display: none; }
.hoja .hueco.en-foco { display: block; color: var(--t-tenue); border: 1pt dashed #D9C08A; border-radius: 4pt; padding: 6pt 9pt; font-size: 8.8pt; }
.hoja tr.hueco.en-foco { display: table-row; border: none; padding: 0; }
.hoja tr.hueco.en-foco td { color: var(--t-tenue); font-size: 8.4pt; border-bottom: 1pt dashed #D9C08A; }
#impresion .hueco { display: none !important; }

/* Pieza por pieza · estilos propios
   La paleta sale del emblema de la presa: el monte (verde oscuro) y el agua (azul).
   Los números sobre la foto van en ámbar, como banderas de campo: es lo único que grita. */
:root {
  color-scheme: light;
  --petroleo: #1E4A36;
  --verde: #23708D;
  --verde-hondo: #1A5870;
  --arena: #E3A23C;
  --tinta: #1B2A27;
  --plano: #EDF2EE;
  --linea: #D3DED8;
  --campo-borde: #BDCDC6;
  --agua-fondo: #E7F1F5;
  /* layout: la guía de la mochila, una pregunta a la vez a la izquierda y la hoja a la derecha */
}
body { background: var(--plano); }

/* ---------- La guía: lo propio de Pieza por pieza ---------- */
.guia .pregunta h2 .n-pin { width: 34px; height: 34px; font-size: 17px; vertical-align: 3px; margin-right: 4px; }
.guia .pregunta .cuerpo > .campo + .campo, .guia .pregunta .cuerpo > .resp-grande + .campo, .guia .pregunta .cuerpo > .palomita + .campo { margin-top: 14px; }
.guia .pregunta .cuerpo > :last-child { margin-bottom: 0; }
.cuerpo .falta { margin: 0 0 14px; }
.falta .btn-texto { color: var(--ojo); }
.nota-chica { font-size: 13.5px; color: var(--tenue); margin: 12px 0 0; }
.nota-chica .btn-texto { font-size: 13.5px; }
.aviso-ejemplo { display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; background: #fff; border: 1px dashed var(--campo-borde); border-radius: 12px; padding: 12px 16px; margin: 0 0 14px; font-size: 14.5px; color: var(--tinta-2); }
.aviso-ejemplo p { margin: 0; flex: 1 1 280px; }
.sello-modo { display: flex; gap: 8px; align-items: baseline; margin: 0 0 14px; font-size: 14px; color: var(--tinta-2); }
.sello-modo i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--tenue); display: inline-block; }
.sello-modo.con-agente i { background: #2E8B57; }
.sello-modo a { font-weight: 500; }
.despues { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--linea); }
.despues h3 { margin-top: 0; }
.agregar-aqui { margin: 12px 0 0; }
body.guiada .panel-hoja .mesa-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* Opciones que se tocan: el componente, las respuestas del agente, los imponderables */
.opciones-grandes { display: grid; gap: 8px; }
.opcion { display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 12px; align-items: center; text-align: left; border: 1px solid var(--campo-borde); background: #fff; border-radius: 12px; padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; }
.opcion i { grid-row: 1 / span 2; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.opcion .t { font-weight: 600; font-size: 16px; color: var(--tinta); }

  function tarjetaRenglon(r, i) {

      '<p class="nota-chica">Si no los investigan, la precotización sale con esos precios marcados como sin fuente.</p>';

  function cImp() {

  /* ---------- 6 · Pedir cotizaciones ---------- */

  function cSolicitud(gid) {

  /* ---------- El plano para quien hace la pieza ---------- */
  function oficio(id) { return A.oficio(id); }

    if (/madereria|carpinter/i.test(t)) return 'carpinteria';
    if (/alba[ñn]il|cemento|block|tabique|mortero/i.test(t)) return 'albanileria';
    return '';
  }
  function cPlano() {
    var o = P.plano, sug = oficioSugerido();

      '<div class="campo"><label for="pl-oficio">¿Quién la va a hacer?</label><select id="pl-oficio" data-k="plano.oficio">' + opciones(D.OFICIOS.map(function (x) { return [x.id, x.nombre]; }), o.oficio, 'Sin plano') + '</select>' +
      (sug && !o.oficio ? '<div class="ayuda">Por lo que trae la lista, parece de ' + esc(minus(oficio(sug).nombre)) + '.</div>' : '') + '</div>';

      '<div class="campo"><label for="pl-respetar">Lo que no debe cambiar <span class="ayuda">(opcional)</span></label><input type="text" id="pl-respetar" data-k="plano.respetar" placeholder="Por ejemplo: que se pueda desarmar para guardarla en lluvias" autocomplete="off"></div>' +
      '<ol class="encargo-pasos"><li>Copia el encargo del plano: ya trae la pieza, la lectura de la foto, las medidas y la lista.<div class="ias"><button type="button" class="btn chico" data-accion="copiar-plano">' + M.ico.copiar + 'Copiar el encargo</button></div></li>' +

      '<div class="campo"><label for="pl-quien">Quién lo revisó</label><input class="grande" type="text" id="pl-quien" data-k="plano.quien" placeholder="Por ejemplo: el herrero de Concá" autocomplete="off"></div>' +

  /* ---------- 7 · Lo que cotizaron ---------- */

    var g = grupo(gid); if (!g) return '';
    var cs = cotsDeGrupo(gid), nec = necGrupo(g), ab = abierto.cot[gid], i = -1;
    P.cotizaciones.forEach(function (c, j) { if (c.id === ab) i = j; });
    var h = '<p class="porque">Registra cada cotización que llegue: de quién es y cuánto pidió por cada concepto. ' + (nec === 3 ? 'Para esta solicitud se necesitan tres, dos por escrito.' : 'Para esta solicitud basta una.') + '</p>';
    if (i >= 0) h += editorCot(P.cotizaciones[i], i, g, cs.indexOf(P.cotizaciones[i]) + 1);
    if (cs.length) h += '<p class="rg-van">' + (cs.length === 1 ? 'Ya hay una' : 'Ya van ' + cs.length) + '</p><ol class="rg-lista">' + cs.map(function (c, j) {
      var n = g.rs.filter(function (r) { return +(c.precios || {})[r.id] > 0; }).length, tot = g.rs.reduce(function (a, r) { var v = +(c.precios || {})[r.id] || 0; return a + v * (+r.cantidad || 0); }, 0);
      return '<li class="rg-fila' + (c.id === ab ? ' actual' : '') + '"><span class="rg-n">' + (j + 1) + '</span><span class="rg-t' + (c.proveedor ? '' : ' vacio-t') + '">' + esc(c.proveedor || 'Sin nombre todavía') + '</span>' +
        '<span class="rg-d">' + esc([M.fechaCorta(c.fecha), c.escrito ? 'por escrito' : 'de palabra', n + ' de ' + g.rs.length + ' conceptos', tot ? pesos(tot) : ''].filter(Boolean).join(' · ')) + '</span>' +
        '<span class="rg-a">' + (c.id === ab ? '<span class="rg-aqui">aquí</span>' : '<button type="button" data-accion="abrir-cot" data-g="' + gid + '" data-id="' + c.id + '">Cambiar</button>') + '</span></li>';
    }).join('') + '</ol>';
    h += '<p class="agregar-aqui"><button type="button" class="btn' + (cs.length ? ' claro' : '') + '" data-accion="agregar-cot" data-g="' + gid + '">' + M.ico.mas + (cs.length ? 'Agregar otra cotización' : 'Registrar la primera cotización') + '</button></p>';
    h += '<h3>Cómo va la regla</h3><ul class="regla-lista">' + g.rs.map(function (r) { return '<li><span class="t">' + esc(r.que) + '</span><span data-vivo="regla:' + r.id + '">' + reglaChip(r) + '</span></li>'; }).join('') + '</ul>';
    return h;
  }
  function editorCot(c, i, g, pos) {

    return '<div class="rg-editor" data-sin-enter><p class="rg-cual">Cotización ' + pos + '</p>' +
      '<div class="campo"><label for="c-prov">De quién es</label><input class="grande" type="text" id="c-prov" data-k="' + k + 'proveedor" placeholder="Nombre de la tienda o de la persona" autocomplete="off"></div>' +
      '<div class="envoltura"><table class="tp precios-cot"><thead><tr><th>Concepto</th><th class="num">Precio unitario</th><th class="num">Importe</th></tr></thead><tbody>' + g.rs.map(function (r) {
        return '<tr><td>' + esc(r.que) + '<div class="fuente-chica">' + cifra(r.cantidad) + ' ' + esc(r.unidad) + '</div></td><td class="num"><input class="precio" type="text" inputmode="decimal" data-tipo="num" data-k="' + k + 'precios.' + r.id + '" placeholder="no cotizó" aria-label="Precio de ' + esc(r.que) + '"></td><td class="num" data-vivo="imp:' + c.id + ':' + r.id + '"></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="datos-cot"><label>Fecha<input type="date" data-k="' + k + 'fecha"></label><label>Lugar<input type="text" data-k="' + k + 'lugar" placeholder="Arroyo Seco"></label>' +
      '<label>IVA<select data-k="' + k + 'iva">' + opciones(IVA, c.iva) + '</select></label><label>Flete<select data-k="' + k + 'flete">' + opciones(FLETE, c.flete) + '</select></label>' +
      '<label class="palomita"><input type="checkbox" data-k="' + k + 'escrito"> Por escrito</label></div>' +
      '<div class="rg-botones"><button type="button" class="btn chico" data-accion="cerrar-cot" data-g="' + g.id + '">Listo</button><button type="button" class="btn-texto peligro" data-accion="quitar-cot" data-g="' + g.id + '" data-id="' + c.id + '">Quitar esta cotización</button></div></div>';
  }
  function reglaChip(r) {
    var g = regla(r);
    if (g.ok) return '<span class="regla ok">Listo · ' + g.tiene + (g.nec === 3 ? ', ' + g.escritas + ' por escrito' : '') + '</span>';
    var faltan = Math.max(0, g.nec - g.tiene), t = [];

  function cElegir() {
    var cps = compras(), con2 = cps.filter(function (r) { return cotsDe(r).length >= 2; });
    var con1 = cps.filter(function (r) { return cotsDe(r).length === 1; }).length, sin = cps.filter(function (r) { return !cotsDe(r).length; }).length;
    var nota = (con1 || sin) ? '<p class="nota-chica">' + [con1 ? (con1 === 1 ? 'Un concepto tiene' : con1 + ' conceptos tienen') + ' una sola cotización: se usa esa.' : '', sin ? (sin === 1 ? 'Un concepto no tiene' : sin + ' conceptos no tienen') + ' cotización: se queda el precio de referencia, marcado.' : ''].filter(Boolean).join(' ') + '</p>' : '';
    if (!con2.length) return '<p class="porque">' + (P.cotizaciones.length ? 'Ningún concepto tiene todavía dos cotizaciones: se usa la única que hay.' : 'Cuando lleguen las cotizaciones, aquí se elige con cuál se quedan.') + '</p>' + nota;
    return '<p class="porque">Por cada concepto se usa la más barata, salvo que haya una razón para otra: la calidad, el flete o que sí entregan en La Florida.</p>' + con2.map(function (r) {
      var cs = cotsDe(r).slice().sort(function (a, b) { return a.precio - b.precio; }), e = elegida(r), barata = cs[0];
      return '<div class="elige"><div class="elige-t">' + esc(r.que) + ' <span class="ayuda">' + cifra(r.cantidad) + ' ' + esc(r.unidad) + '</span></div><div class="elige-op">' + cs.map(function (x, j) {
        return '<label><input type="radio" name="el-' + r.id + '" value="' + esc(x.c.id) + '" data-k="eleccion.' + r.id + '.cot"' + (e && e.c.id === x.c.id ? ' checked' : '') + '><span><b>' + pesos(x.precio) + '</b> ' + esc(x.c.proveedor || 'Sin nombre') + (j === 0 ? ' <small>la más barata</small>' : '') + (x.c.escrito ? '' : ' <small>de palabra</small>') + '</span></label>';
      }).join('') + '</div>' +

    }).join('') + nota;
  }

  /* ---------- 8 · La partida ---------- */

        x.partidas = (x.partidas || []).filter(function (pt) { return !quitar[pt.actividad]; });
        var sig = x.partidas.reduce(function (a, pt) { return Math.max(a, +pt.id || 0); }, 0) + 1;
        usadas.forEach(function (p) { aPartidas(p).forEach(function (pt) { pt.id = sig++; x.partidas.push(pt); }); });
        x.sig = sig; x.version = 3; x.componente = x.componente || P.componente; x.equipo = x.equipo || P.equipo.nombres || '';
        x.guardado = new Date().toISOString(); x.piezaPorPieza = { fecha: x.guardado, piezas: usadas.map(function (p) { return p.nombre; }) };
        delete x.resumen;
        var nombre = 'presupuesto-' + (x.componente || 'sin-componente') + '-' + (slug(x.equipo || 'equipo').slice(0, 40) || 'equipo') + '.json';
        bajar(nombre, JSON.stringify(x, null, 1), 'application/json').then(function () { M.cerrarCajon(d); M.aviso('Ábrelo en la práctica del presupuesto o súbelo a la página que junta los archivos.'); });
      }
    };
    pintar(); M.abrirCajon(d);
  }

  /* ---------- Fotos ---------- */
  function leerFoto(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, k = Math.min(1, 1400 / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var src; try { src = c.toDataURL('image/jpeg', .84); } catch (e) { src = r.result; }
        cb({ src: src, w: c.width, h: c.height });
      };
      img.onerror = function () { M.aviso('Esa imagen no se pudo abrir. Prueba con un JPG o un PNG.', 'mal'); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
  function rasterizarIlustracion(p) {
    var f = p.fotos[0]; if (!f || !/^data:image\/svg/.test(f.src)) return;
    var img = new Image();
    img.onload = function () {
      try {
        var c = document.createElement('canvas'); c.width = f.w || 1200; c.height = f.h || 780;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        f.src = c.toDataURL('image/jpeg', .86);
        if (P === p && guia) rehacerTodo();
      } catch (e) {}
    };
    img.src = f.src;
  }

  /* ---------- Leer y pegar respuestas del agente ---------- */
  function fotosParaClaude() { return P.fotos.map(function (f) { return f.src; }).filter(function (s) { return /^data:image\/(jpeg|png|webp|gif)/.test(s); }); }
  function aplicarLectura(o, origen) {
    var Lr = A.normalizarLectura(o); Lr.origen = origen; Lr.fecha = hoy();
    P.lectura = Lr;
    // las respuestas viejas se quedan solo si la pregunta sigue
    var R = {}; Lr.preguntas.forEach(function (q) { if (P.respuestas[q.id] && P.respuestas[q.id].valor !== undefined) R[q.id] = P.respuestas[q.id]; });
    P.respuestas = R;
  }
  function aplicarLista(o, origen) {
    var Ls = A.normalizarLista(o, elementos());
    Ls.renglones.forEach(function (r, i) { r.id = 'r' + (i + 1); });
    Ls.sig = Ls.renglones.length + 1; Ls.origen = origen; Ls.fecha = hoy();
    P.lista = Ls; P.eleccion = {}; P.explicaciones = {}; P.bolsillos = {}; P.acts = {};
    // las cotizaciones se quedan, pero sus precios por renglón ya no aplican
    P.cotizaciones.forEach(function (c) { c.precios = {}; });
    abierto = { rg: '', cot: {} };
  }
  function pasoDe(cual) { return cual === 'lectura' ? 'leer' : 'armar'; }
  function conClaude(cual) {
    if (!A.hayAgente()) { modoCopiar = true; refrescarSeccion(pasoDe(cual)); return; }
    var prompt = cual === 'lectura' ? A.encargoLectura(P, false) : A.encargoLista(P, false);
    var ctl = new AbortController(), p = P;
    trabajando = { que: cual, ctl: ctl }; errorAgente = null; refrescarSeccion(pasoDe(cual));
    A.preguntar(prompt, { fotos: cual === 'lectura' ? fotosParaClaude() : [], signal: ctl.signal }).then(function (o) {
      if (P !== p || !trabajando || trabajando.ctl !== ctl) return;
      trabajando = null;
      try { if (cual === 'lectura') aplicarLectura(o, 'claude'); else aplicarLista(o, 'claude'); }
      catch (e) { errorAgente = { que: cual, mensaje: e.message }; refrescarSeccion(pasoDe(cual)); return; }
      rehacerTodo(); M.aviso(cual === 'lectura' ? 'El agente leyó la foto.' : 'La lista está lista.');
    }, function (e) {
      if (P !== p || !trabajando || trabajando.ctl !== ctl) return;
      trabajando = null;
      errorAgente = { que: cual, mensaje: e.mensaje || AG.MENSAJES.upstream_error };
      if (A.entorno.vetado) modoCopiar = true;
      refrescarSeccion(pasoDe(cual));
    });
  }
  function leerPegado(cual) {
    var t = ($('#pegado-' + cual) || {}).value || '';
    try {
      var o = A.leerJSON(t);
      if (cual === 'lectura') aplicarLectura(o, 'pegado'); else aplicarLista(o, 'pegado');
      errorAgente = null; rehacerTodo(); M.aviso('Respuesta leída.');
    } catch (e) {
      errorAgente = { que: cual, mensaje: e.message }; refrescarSeccion(pasoDe(cual));
      var ta = $('#pegado-' + cual); if (ta) ta.value = t;
    }
  }
  function leerTabla() {
    var t = ($('#pegado-web') || {}).value || '', filas = A.leerTablaWeb(t), n = 0;
    filas.forEach(function (f) {
      var r = renglones().filter(function (x) { return x.id.toLowerCase() === f.id.toLowerCase(); })[0];
      if (r && f.precio > 0) { r.precio = Math.round(f.precio * 100) / 100; r.origen = 'web'; r.fuente = { tienda: f.tienda || 'sin tienda', lugar: f.lugar, fecha: f.fecha, enlace: f.enlace }; n++; }
    });
    if (!n) { M.aviso('No se encontró ningún precio en la tabla. Revisa que traiga la columna «clave» con r1, r2…', 'mal'); return; }
    actualizar(); M.aviso(n + (n === 1 ? ' precio actualizado' : ' precios actualizados') + ' con su fuente.');
  }
  function textoWhatsApp(gid) {
    var g = grupo(gid); if (!g) return '';
    return ['Buen día. Le escribo del ' + PROYECTO.nombre + ' (Arroyo Seco, Qro.). Estamos armando el presupuesto de un anteproyecto y le pedimos cotizar:', '']
      .concat(g.rs.map(function (r, i) { return (i + 1) + '. ' + r.que + ': ' + cifra(r.cantidad) + ' ' + r.unidad; }))
      .concat(['', '¿Nos puede indicar precio unitario, si incluye IVA, el flete hasta La Florida, la vigencia y el tiempo de entrega? No es una orden de compra: es para el presupuesto.', '', 'Gracias. ' + (P.equipo.contacto || '') + (P.equipo.telefono ? ' · ' + P.equipo.telefono : '') + ' · Folio ' + folioSol(gid)]).join('\n');
  }

  /* ---------- Los eventos ---------- */
  function nuevoRenglon(n) {
    var Ls = P.lista;
    var r = { id: 'r' + (Ls.sig++), n: n, tipo: n ? 'material' : 'mano', que: '', unidad: n ? 'pieza' : 'jornal', cantidad: 1, calculo: '', ref: '', precio: 0, origen: 'estimacion', proveedor: n ? 'materiales' : 'mano', forma: n ? 'compra' : 'faena', nota: 'agregado por el equipo' };
    Ls.renglones.push(r);
    return r;
  }
  var ACC = {
    componente: function (b) {
      if (P.componente === b.dataset.id) return;
      P.componente = b.dataset.id; P.piezaId = ''; P.nombre = ''; P.actividades = []; P.decidido = '';
      actualizar();
    },
    pieza: function (b) {
      var id = b.dataset.id;
      P.piezaId = id;
      if (id === 'otra') { P.nombre = ''; P.actividades = []; P.decidido = ''; }
      else { var x = pieza(id); P.nombre = x.nombre; P.actividades = x.acts.slice(); P.decidido = x.decidido; }
      actualizar();
      if (id === 'otra') enfocar($('#f-otra'));
    },
    'quitar-foto': function (b) { P.fotos.splice(+b.dataset.i, 1); actualizar(); },
    claude: function (b) { conClaude(b.dataset.cual); },
    parar: function (b) { var cual = trabajando && trabajando.que; if (trabajando && trabajando.ctl) trabajando.ctl.abort(); trabajando = null; if (cual) refrescarSeccion(pasoDe(cual)); else actualizar(); },
    'modo-copiar': function () { modoCopiar = true; refrescarSeccion(guia.actual()); },
    'modo-claude': function () { modoCopiar = false; errorAgente = null; refrescarSeccion(guia.actual()); },
    'copiar-encargo': function (b) {
      var t = b.dataset.cual === 'lectura' ? A.encargoLectura(P, true) : A.encargoLista(P, true);
      M.copiar(t).then(function (ok) { if (ok) M.aviso(b.dataset.cual === 'lectura' ? 'Encargo copiado. Pégalo en la IA y adjunta la foto.' : 'Encargo copiado. Pégalo en la misma conversación o en una nueva.'); else mostrarTexto('Copia el encargo', t, 'No se pudo copiar solo: selecciona el texto y cópialo.'); });
    },
    'leer-pegado': function (b) { leerPegado(b.dataset.cual); },
    sugerencia: function (b) {
      var q = preguntaPorId(b.dataset.id); if (!q) return;
      M.ponerRuta(P, 'respuestas.' + q.id + '.valor', q.sugerido); actualizar();
    },
    'agregar-pin': function () { agregarPin = !agregarPin; refrescarSeccion('numeros'); },
    'agregar-el': function () { agregarElemento(.5, .5); },
    'quitar-el': function (b) {
      var n = +b.dataset.n;
      var quitar = function () { P.lectura.elementos = elementos().filter(function (e) { return e.n !== n; }); renglones().forEach(function (r) { if (r.n === n) r.n = 0; }); actualizar(); };
      if (renglones().some(function (r) { return r.n === n; })) confirmar('Hay renglones de la lista con el número ' + n + '. Se quedan, pero pasan a «de toda la pieza».', 'Quitar el número', quitar); else quitar();
    },
    'volver-leer': function () { confirmar('Se borra la lectura de la foto y sus preguntas. Las respuestas que coincidan se conservan.', 'Volver a leer', function () { P.lectura = null; rehacerTodo(); }); },
    'rehacer-lista': function () { confirmar('Se reemplaza la lista. Las cotizaciones registradas se quedan, pero hay que volver a poner sus precios por renglón.', 'Volver a armarla', function () { P.lista = null; abierto = { rg: '', cot: {} }; rehacerTodo(); }); },
    'abrir-rg': function (b) { abierto.rg = b.dataset.id; refrescarSeccion(guia.actual()); enfocar($('#e-que')); },
    'cerrar-rg': function () { abierto.rg = ''; actualizar(); },
    'agregar-rg': function (b) {
      var r = nuevoRenglon(+b.dataset.n); abierto.rg = r.id;
      actualizar(); enfocar($('#e-que'));
    },
    'quitar-rg': function (b) {
      var r = renglones().filter(function (x) { return x.id === b.dataset.id; })[0]; if (!r) return;
      confirmar('¿Quitar «' + (r.que || 'el renglón') + '» de la lista?', 'Quitarlo', function () {
        P.lista.renglones = renglones().filter(function (x) { return x.id !== r.id; }); abierto.rg = ''; actualizar();
      });
    },
    'copiar-investigar': function () {
      var t = A.encargoInvestigar(P, sinFuente());
      M.copiar(t).then(function (ok) { if (ok) M.aviso('Encargo copiado. Pégalo en una IA con búsqueda en la web.'); else mostrarTexto('Copia el encargo', t, 'Selecciona el texto y cópialo.'); });
    },
    'copiar-plano': function () {
      var t = A.encargoPlano(P);
      M.copiar(t).then(function (ok) { if (ok) M.aviso('Encargo del plano copiado. Pégalo en Claude' + (P.fotos.length ? ' con la foto.' : '.')); else mostrarTexto('Copia el encargo del plano', t, 'Selecciona el texto y cópialo.'); });
    },
    'copiar-plano-ajuste': function () {
      var t = A.encargoPlanoAjuste(P);
      M.copiar(t).then(function (ok) { if (ok) M.aviso('Encargo del ajuste copiado. Pégalo en el mismo chat del plano.'); else mostrarTexto('Copia el encargo del ajuste', t, 'Selecciona el texto y cópialo.'); });
    },
    'leer-tabla': leerTabla,
    'agregar-cot': function (b) {
      var c = { id: 'c' + M.uid().slice(-6), proveedor: '', grupo: b.dataset.g, lugar: '', fecha: hoy(), escrito: false, iva: 'nodice', flete: 'nodice', notas: '', precios: {} };
      P.cotizaciones.push(c); abierto.cot[b.dataset.g] = c.id;
      actualizar(); enfocar($('#c-prov'));
    },
    'abrir-cot': function (b) { abierto.cot[b.dataset.g] = b.dataset.id; refrescarSeccion(guia.actual()); enfocar($('#c-prov')); },
    'cerrar-cot': function (b) { abierto.cot[b.dataset.g] = ''; actualizar(); },
    'quitar-cot': function (b) {
      confirmar('¿Quitar esta cotización?', 'Quitarla', function () {
        P.cotizaciones = P.cotizaciones.filter(function (c) { return c.id !== b.dataset.id; }); abierto.cot[b.dataset.g] = ''; actualizar();
      });
    },
    'llevar-equipo': function () { guardarYa(); llevarAlEquipo(); },
    nueva: function () { guardarYa(); var p = nueva(); abrir(p); guardarYa(); },
    'descargar-pieza': descargarPieza,
    hoja: function () { return sacarHoja(); }
  };
  function alClic(e) {
    var b = e.target.closest('[data-accion]'); if (!b || b.disabled) return;
    var f = ACC[b.dataset.accion]; if (f) { e.preventDefault(); f(b, e); }
  }
  function valorDe(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.dataset.tipo === 'num') return el.value === '' ? '' : M.num(el.value);
    return el.value;
  }
  function alEscribir(e) {
    var el = e.target;
    if (el.dataset && el.dataset.k) {
      var opcion = el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio';
      if (e.type === 'input' && opcion) return;
      if (el.type === 'radio' && !el.checked) return;
      M.ponerRuta(P, el.dataset.k, valorDe(el));
      if (opcion) { actualizar(); return; }
      refrescarVivos();
      cambio();
      return;
    }
    if (e.type !== 'change') return;
    if (el.dataset && el.dataset.accionCambio === 'act-otra') { P.actividades = el.value ? [el.value] : []; actualizar(); }
    else if (el.dataset && el.dataset.accionCambio === 'causa') {
      var r = el.dataset.r, c = el.dataset.c;
      P.explicaciones[r] = P.explicaciones[r] || { causas: [], texto: '' };
      var cs = P.explicaciones[r].causas || (P.explicaciones[r].causas = []);
      var i = cs.indexOf(c); if (el.checked && i < 0) cs.push(c); if (!el.checked && i >= 0) cs.splice(i, 1);
      cambio(); guia.refrescar();
    } else if (el.dataset && el.dataset.accionArchivo === 'fotos') {
      var fs = Array.prototype.slice.call(el.files || [], 0, 3 - P.fotos.length), pend = fs.length;
      fs.forEach(function (f) { leerFoto(f, function (x) { P.fotos.push(x); if (--pend === 0) actualizar(); }); });
    }
  }
  /* Enter en los editores de la lista: cierra el renglón o pasa al siguiente precio */
  function alTeclear(e) {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    var el = e.target;
    if (!el.matches || !el.matches('input')) return;
    if (el.closest('.rv.abierto')) { e.preventDefault(); el.blur(); ACC['cerrar-rg'](); return; }
    if (el.matches('.precios-cot input.precio')) {
      e.preventDefault();
      var ps = $$('.precios-cot input.precio', el.closest('.rg-editor')), i = ps.indexOf(el);
      if (ps[i + 1]) enfocar(ps[i + 1]); else el.blur();
    }
  }

  /* ---------- Arranque ---------- */
  function iniciar() {
    sePuedeGuardar = probarGuardado();
    $('#trabajo').addEventListener('click', alClic);
    $('#mesa').addEventListener('click', alClic);
    $('.conmutador').addEventListener('click', alClic);
    $('#trabajo').addEventListener('input', alEscribir);
    $('#trabajo').addEventListener('change', alEscribir);
    $('#trabajo').addEventListener('keydown', alTeclear, true);
    $('#b-guardar').addEventListener('click', function () { guardarYa(); descargarPieza(); });
    $('#b-piezas').addEventListener('click', function () {
      guardarYa();
      M.listaDocs({
        titulo: 'Mis piezas', archivero: ARCH, nuevoTexto: 'Pieza nueva',
        describir: function (d) { var c = comp(d.componente); return { t: d.nombre || 'Pieza sin nombre', v: d.lista ? pesos(sumarDe(d)) : '', d: (c ? c.id + ' · ' + c.corto + ' · ' : '') + 'va en ' + minus(ORDEN_T[Math.max(0, Math.min(7, (d.paso || 1) - 1))]) + (d.ejemplo ? ' · ejemplo' : '') }; },
        alNuevo: function () { var p = nueva(); abrir(p); guardarYa(); },
        alAbrirArchivo: abrirArchivo,
        alEjemplo: function () { var p = window.PXP_EJEMPLO(hoy()); p.paso = 1; rasterizarIlustracion(p); abrir(p); guardarYa(); },
        alAbrir: function (d) { if (d) abrir(d); },
        alDuplicar: function (d) { if (!d) return; var c = JSON.parse(JSON.stringify(d)); c.id = M.uid(); c.nombre = (c.nombre || 'Pieza') + ' (copia)'; c.ejemplo = false; delete c.guia; abrir(c); guardarYa(); },
        alBorrar: function (id) { if (P && P.id === id) { var l = ARCH.lista(); abrir(l[0] || nueva()); } }
      });
    });
    window.addEventListener('pagehide', guardarYa);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') guardarYa(); });
    A.alCambiarEntorno = function () {
      if (!P || !guia) return;
      var a = guia.actual();
      if (a === 'leer' || a === 'armar') refrescarSeccion(a);
      else { var s1 = seccion('leer'), s2 = seccion('armar'); [s1, s2].forEach(function (s) { if (s) refrescarSeccion(s.dataset.paso); }); }
      pintarHoja();
    };
    M.montarVista();
    var actual = sePuedeGuardar ? ARCH.obtener(ARCH.idActual()) || ARCH.lista()[0] : null;
    if (actual) abrir(actual);
    else { var ej = window.PXP_EJEMPLO(hoy()); ej.paso = 1; rasterizarIlustracion(ej); abrir(ej); }
    if (!sePuedeGuardar) pintarEstado('Esta vista no guarda en el navegador: usa «Guardar archivo».');
    window.addEventListener('resize', function () { M.ajustarHoja($('#marco')); });
  }
  function sumarDe(d) { var g = P; P = normal(JSON.parse(JSON.stringify(d))); var t = sumas('real').total; P = g; return t; }
  // para las pruebas
  window.PXP_APP = {
    estado: function () { return P; }, sumas: function (m) { return sumas(m); }, regla: function (r) { return regla(r); },
    aPartidas: function () { return aPartidas(P); }, tres: function () { return tres(); }, abrir: function (p) { abrir(normal(p)); },
    guia: function () { return guia; }, pasos: function () { return estructura().map(function (s) { return s.id; }); },
    word: function (cual, g) { return (cual === 'solicitud' ? wordSolicitud(g || (grupos()[0] || {}).id) : wordPartida()).then(function (d) { return d.blob(); }); },
    imagen: function () { return imagenPartida(); }, foto: function () { return fotoConNumeros(800); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

</script>
